:root{font-family:Inter,Arial,sans-serif;color:#263349;background:#f6f7fb;--a:#6258c8;--border:#e5e6ee}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9e98e6}header{background:white;border-bottom:1px solid var(--border)}.wrap{max-width:1120px;margin:auto;padding:0 22px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;font-size:21px;color:#31285e}.brand span{display:inline-grid;place-items:center;width:39px;height:39px;border-radius:13px;background:#efedff;margin-right:8px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button,.subtle{background:#f0eff9;color:#4b426d;padding:10px 15px;border-radius:12px;font-weight:700}.tabs button.active,.primary{background:var(--a);color:white}.hero{padding:38px 0 22px}.eyebrow{color:var(--a);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:800}h1{font-size:clamp(28px,4vw,38px);margin:10px 0;color:#30294d}h2{font-size:22px;color:#30294d}h3{margin:0 0 6px;font-size:17px}.muted{color:#69738a}p{line-height:1.55}main{padding-bottom:50px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:180px;padding:13px 15px;border:1px solid var(--border);border-radius:12px;background:#fff}.primary{border-radius:12px;padding:12px 16px;font-weight:750}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card,.panel{background:white;border:1px solid var(--border);border-radius:19px;padding:21px;box-shadow:0 8px 22px #25254409}.card{min-height:135px;text-align:left;display:flex;flex-direction:column;gap:10px}.symbol{font-size:27px}.tag{display:inline-block;border-radius:99px;background:#edeafd;padding:6px 10px;font-size:12px;color:#5148a8;font-weight:700}.back{padding:0;background:transparent;color:var(--a);font-weight:750;margin-bottom:15px}.blockgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:14px}.block{border:1px solid var(--border);padding:19px;border-radius:16px;background:#fff;min-height:150px}.block .symbol{display:block;margin-bottom:12px}.panel{margin-bottom:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.lesson{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;border:1px solid var(--border);border-radius:12px;background:#fff}.lesson:hover,.card:hover{border-color:#aba3ee}.pill{padding:5px 10px;border-radius:50px;background:#e7f7ee;color:#17754a;font-size:12px}label{display:block;margin:12px 0 5px;font-weight:700;font-size:14px}input,select,textarea{padding:12px;border:1px solid #dcdfea;border-radius:10px;width:100%;background:#fff}textarea{min-height:100px}.check{display:flex;align-items:center;gap:8px;margin:10px 0}.check input{width:auto}.note{border-left:4px solid #b6a8ee;padding:12px 16px;background:#f2efff;border-radius:9px;font-size:14px}.hidden{display:none!important}.empty{border:2px dashed #dcdde9;background:#fafaff;padding:23px;border-radius:15px;color:#667089}.tiny{font-size:12px}.doc{display:inline-block;padding:9px 12px;background:#f0eff9;border-radius:10px;margin:4px 5px 4px 0}footer{padding:25px 0;color:#72768d;font-size:12px}@media(max-width:650px){.top{height:auto;padding:18px 0;align-items:flex-start;flex-direction:column}.tabs{width:100%}.tabs button{flex:1}.hero{padding-top:25px}.wrap{padding:0 15px}}

.authbox{max-width:580px}.status{font-size:13px;padding:12px;border-radius:10px;background:#edf2ff;margin:12px 0;white-space:pre-wrap}.warning{background:#fff5dd;color:#725308;padding:14px;border-radius:12px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.photo-grid img{width:100%;height:150px;object-fit:cover;border-radius:12px;cursor:pointer}.photo-grid a{display:block;word-break:break-word}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0} .secondary{background:#eeebfb;color:#443a96;border-radius:12px;padding:10px 14px;font-weight:700}.wide{max-width:770px}.lesson-head{margin-bottom:16px}.hint{font-size:13px;color:#6b7285} .boxline{border-top:1px solid #eee;padding-top:14px;margin-top:14px} .mobile-panel{background:#f5f2ff;border:1px solid #d9d3ff;border-radius:17px;padding:20px;margin:18px 0}.qrwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.qrwrap canvas,.qrwrap img{border:8px solid white;border-radius:10px;max-width:180px}.mobile-link{overflow-wrap:anywhere;font-size:13px}.photo-grid a{display:flex;flex-direction:column;gap:5px}.photo-grid a span{overflow-wrap:anywhere}.mobile-panel .actions button{min-height:45px}@media(max-width:650px){.qrwrap{justify-content:center}} 
.chapter-title{font-size:clamp(30px,5vw,48px);font-weight:850;color:#30294d;letter-spacing:-.035em;line-height:1.12;margin:12px 0 18px}.chapter-card{width:100%;text-align:left;background:#fff;border:1px solid #ddd9f3;border-radius:17px;padding:23px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 5px 14px #29204b08}.chapter-card strong{font-size:clamp(20px,3vw,28px);color:#30294d}.doc-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.doc-group{border:1px solid #e5e6ee;border-radius:16px;padding:16px;background:white;min-height:150px}.doc-group h3{font-size:19px;margin-bottom:14px}.file-link{display:block;color:#4b42a0;text-decoration:none;word-break:break-word;border-top:1px solid #eee;padding:12px 0}.file-link:hover{text-decoration:underline}.chapter-hero{background:#efedff;border-radius:18px;padding:25px;margin:16px 0 23px}.chapter-hero .eyebrow{margin-bottom:10px}.chapter-card:hover{border-color:#9085df}.resource-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee;flex-wrap:wrap}.resource-entry a{min-width:140px;flex:1;overflow-wrap:anywhere}.resource-entry button{padding:9px 11px;border-radius:9px}.danger{background:#fff0f0;color:#ad2339;border:1px solid #f0bec7}.resource-buttons{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body><header><div class="wrap top"><div class="brand"><span>🎓</span>Apprendre Ensemble</div><nav class="tabs"><button data-user="Alexane">Alexane</button><button data-user="Clémence">Clémence</button><button data-user="Parent">Parent ⚙</button></nav></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Bibliothèque pédagogique · Seconde</div><h1 id="welcome"></h1><p id="description" class="muted"></p></section><div id="app"></div></main><footer class="wrap">V11 – Gestion des chapitres et documents — prototype familial : photographies privées sur Supabase ; contenus pédagogiques et réglages conservés localement sur cet appareil. Pas d’IA automatique.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const subjects=['Mathématiques','Physique-Chimie','SVT','Français','Histoire-Géographie','Anglais','Espagnol','SES','SNT','Autre'];
const icons={'Mathématiques':'📐','Physique-Chimie':'⚗️','SVT':'🌿','Français':'📚','Histoire-Géographie':'🌍','Anglais':'💬','Espagnol':'🗣️','SES':'📈','SNT':'💻','Autre':'🗂️'};
const blocks=[['cours','📖','Leçon'],['exercices','✏️','Exercices'],['corrige','✅','Corrigé'],['memo','📝','Mémo / Synthèse']];
const seed=()=>({subjects:['Mathématiques'],lessons:[],visible:{cours:true,exercices:true,corrige:true,memo:true}});
const key='ae_v4_library_'; const cfgKey='ae_v5_public_config';
const load=n=>{try{return {...seed(),...JSON.parse(localStorage.getItem(key+n)||'{}')}}catch{return seed()}};
const save=(n,v)=>localStorage.setItem(key+n,JSON.stringify(v));
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');let user='Alexane',subject=null,lesson=null,cloudChapter=null,client=null,session=null,authEmail='',parentUIDs={Alexane:'',Clémence:''};
const resourcesBucket='ressources-pedagogiques';const resourceCategories=['cours','exercices','corriges','memos'];const publicSite='https://blbweb.github.io/CLEMALEX/';const bucket='documents eleves';const parentUserId='4a305a54-fcbf-427e-9294-4cf9b7eff101';const idsKey='ae_v6_student_uids';try{parentUIDs={...parentUIDs,...JSON.parse(localStorage.getItem(idsKey)||'{}')}}catch{};const cfg={url:'https://kkmaqrpwsidqxaooxpgk.supabase.co',key:'sb_publishable_z2brnR6VYjKoRf6Cc1JZuw_bEBSeXxa'};
function init(){if(cfg.url&&cfg.key&&window.supabase){try{client=window.supabase.createClient(cfg.url,cfg.key);client.auth.getSession().then(({data})=>{session=data.session;render()}).catch(e=>message(e.message))}catch(e){message(e.message)}}}
function currentId(){return session?.user?.id||''}
function message(t){const e=document.getElementById('msg');if(e)e.textContent=t}
function authenticated(){return !!session}
function isParent(){return authenticated()&&currentId()===parentUserId}
function toolbar(){return `<div class="actions"><button class="secondary" data-act="settings">🔐 Se connecter</button>${authenticated()?`<span class="tag">Connecté : ${safe(session.user.email)}</span><button class="secondary" data-act="logout">Déconnexion</button>`:'<span class="tag">Mode maquette : non connecté</span>'}</div>`}
function render(){document.querySelectorAll('[data-user]').forEach(b=>b.classList.toggle('active',b.dataset.user===user));document.getElementById('welcome').textContent=user==='Parent'?'Organisons les ressources':`Bonjour ${user} 👋`;document.getElementById('description').textContent=user==='Parent'?'Les matières et les contenus sont configurables, sans notes ni classement.':'Retrouve les leçons, exercices, corrigés et mémos facilement.';if(user==='Parent')return parentView();const d=load(user);if(!subject)return subjectsView(d);if(cloudChapter)return cloudChapterView();if(!lesson){lessonsView(d);loadStudentResources();return}return detailView(d)}
function subjectsView(d){app.innerHTML=toolbar()+`<div class="toolbar"><input id="search" placeholder="🔎 Rechercher une matière ou une leçon"><span class="muted tiny">${d.subjects.length} matière(s)</span></div><div class="cards">${d.subjects.map(s=>`<button class="card" data-subject="${safe(s)}"><span class="symbol">${icons[s]||'📁'}</span><h3>${safe(s)}</h3><span class="muted tiny">${d.lessons.filter(l=>l.subject===s).length} leçon(s)</span></button>`).join('')}</div><div class="panel" style="margin-top:22px"><h3>Mes dernières leçons</h3>${d.lessons.slice(-5).reverse().map(l=>`<button class="lesson" data-open="${safe(l.id)}">${safe(l.subject)} → <b>${safe(l.title)}</b></button>`).join('')||'<p class="muted">Aucune leçon ajoutée pour le moment.</p>'}</div>`;document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-subject],[data-open]').forEach(b=>b.classList.toggle('hidden',!b.textContent.toLowerCase().includes(q)))}}
function lessonsView(d){const arr=d.lessons.filter(l=>l.subject===subject);app.innerHTML=toolbar()+`<button class="back" data-act="back-subject">← Toutes les matières</button><h2>${icons[subject]||'📁'} ${safe(subject)}</h2>${subjectMobileArea()}<div class="panel"><h2>📚 Mes chapitres</h2><p class="hint">Ouvre un chapitre pour voir ses cours, exercices, corrigés et mémos dans quatre blocs distincts.</p><div id="chapterList">${arr.map(l=>`<button class="chapter-card" data-open="${safe(l.id)}"><strong>📖 ${safe(l.title)}</strong><span>→</span></button>`).join('')||'<p class="muted">Chargement des chapitres enregistrés en ligne…</p>'}</div></div><div class="panel"><h3>📷 Photos de ${safe(subject)}</h3><p class="hint">Seules les photos de cette matière sont affichées ici. Tu peux renommer ou supprimer tes propres photos après confirmation.</p><div id="msg" class="status" aria-live="polite"></div><div id="subjectPhotos" class="photo-grid"></div></div>`;bindSubjectMobile();if(authenticated()&&!isParent())listSubjectPhotos(currentId(),subject,'subjectPhotos');else if(authenticated()&&isParent())document.getElementById('subjectPhotos').textContent='La consultation des photos des filles se fait dans l’espace Parent.';else document.getElementById('subjectPhotos').textContent='Connecte-toi pour consulter tes photos.'}
function subjectMobileArea(){const url=new URL(publicSite);url.searchParams.set('eleve',user);url.searchParams.set('matiere',subject);const link=url.toString();return `<div class="mobile-panel"><h3>📱 Envoyer depuis mon téléphone</h3><p>La photo sera enregistrée dans <b>${safe(user)} → ${safe(subject)}</b>, pas dans une autre matière.</p><div class="actions"><button class="secondary" id="showQR">Afficher le QR code</button><a class="secondary" href="${safe(link)}" target="_blank" rel="noopener noreferrer">Ouvrir la version mobile ↗</a></div><div class="qrwrap hidden" id="qrArea"><div id="qrCanvas" aria-label="QR code d’accès à la matière"></div><div><p class="hint">Scanne ce code avec le téléphone pour ouvrir cette matière.</p><a class="mobile-link" href="${safe(link)}" target="_blank" rel="noopener noreferrer">${safe(link)}</a><p class="hint">Une connexion au compte personnel reste nécessaire.</p></div></div>${authenticated()&&!isParent()?`<label>Prendre une photo ou choisir plusieurs images</label><input id="subjectPictures" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="actions"><button class="primary" id="subjectUpload">Enregistrer dans ${safe(subject)}</button><button class="secondary" id="refreshSubject">Actualiser les photos</button></div>`:'<p class="warning">Connecte-toi avec le compte de l’élève pour envoyer les photos.</p>'}</div>`}
function bindSubjectMobile(){const qr=document.getElementById('showQR');if(qr)qr.onclick=()=>{const box=document.getElementById('qrArea');box.classList.toggle('hidden');if(!box.classList.contains('hidden')){const url=new URL(publicSite);url.searchParams.set('eleve',user);url.searchParams.set('matiere',subject);const el=document.getElementById('qrCanvas');el.innerHTML='';if(window.QRCode)new QRCode(el,{text:url.toString(),width:160,height:160,correctLevel:QRCode.CorrectLevel.M});else el.textContent='QR code indisponible hors connexion. Utilise le lien ci-contre.'}};const up=document.getElementById('subjectUpload');if(up)up.onclick=uploadSubject;const re=document.getElementById('refreshSubject');if(re)re.onclick=()=>listSubjectPhotos(currentId(),subject,'subjectPhotos')}
async function uploadSubject(){const el=document.getElementById('subjectPictures');const files=[...(el?.files||[])];if(!authenticated())return message('Connecte-toi d’abord.');if(isParent())return message('Utilise un compte élève pour ce dépôt.');if(!files.length)return message('Choisis au moins une photo.');for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10*1024*1024)return message('Formats acceptés : JPG, PNG ou WebP, 10 Mo maximum par photo.')}const folder=`${currentId()}/${slug(subject)}/non-classe`;let count=0;message('Envoi en cours…');for(const f of files){const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg';const filename=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,10)}.${ext}`;const {error}=await client.storage.from(bucket).upload(filename,f,{contentType:f.type,upsert:false});if(error)return message(`${count} fichier(s) envoyé(s). Erreur : ${error.message}`);count++}el.value='';message(`${count} photo(s) enregistrée(s) dans ${subject}.`);await listSubjectPhotos(currentId(),subject,'subjectPhotos',false)}
// Gestion des photos : seules les images du dossier personnel (UID) sont modifiables.
function photoOwnerControls(path, card){
  if(!authenticated()||isParent()||!path.startsWith(currentId()+'/'))return;
  const controls=document.createElement('div');controls.className='actions';
  const rename=document.createElement('button');rename.className='secondary';rename.type='button';rename.textContent='✏️ Renommer';
  rename.onclick=async()=>{
    const old=path.split('/').pop(), current=old.replace(/^\d{13}-[a-z0-9]+-/i,'');
    const requested=prompt('Nouveau nom du fichier (garde l’extension) :',current);
    if(requested===null)return;
    const name=requested.trim().replace(/[^a-zA-Z0-9._-]/g,'_');
    if(!name||name==='.'||name==='..'||name.includes('..')||name.length>110){alert('Nom invalide.');return}
    if(name.split('.').pop().toLowerCase()!==old.split('.').pop().toLowerCase()){alert('Conserve le format du fichier (extension).');return}
    const target=path.slice(0,path.lastIndexOf('/')+1)+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+name;
    if(!confirm('Renommer ce document ?'))return;
    const {error}=await client.storage.from(bucket).move(path,target);
    if(error){alert('Impossible de renommer : '+error.message+'\nVérifie les droits UPDATE et SELECT dans Supabase.');return}
    location.reload();
  };
  const del=document.createElement('button');del.type='button';del.className='secondary';del.textContent='🗑 Supprimer';
  del.onclick=async()=>{
    if(!confirm('Supprimer définitivement cette photo ? Cette action est irréversible.'))return;
    const {error}=await client.storage.from(bucket).remove([path]);
    if(error){alert('Suppression impossible : '+error.message+'\nVérifie la règle DELETE dans Supabase.');return}
    card.remove();
  };
  controls.append(rename,del);card.append(controls);
}
async function listSubjectPhotos(uid,matiere,target,announce=true){const dest=document.getElementById(target);if(!dest||!client||!uid)return;if(announce)message('Chargement des photos de '+matiere+'…');dest.innerHTML='';const {results,errors}=await allPhotoPaths(uid);if(errors.length){dest.textContent='Impossible de charger les photos : '+errors[0];return}const base=slug(matiere);const filtered=results.filter(p=>p.split('/')[1]===base);if(!filtered.length){dest.innerHTML='<p class="muted">Aucune photo dans cette matière pour le moment.</p>';if(announce)message('Aucune photo trouvée dans '+matiere+'.');return}for(const path of filtered){const {data,error}=await client.storage.from(bucket).createSignedUrl(path,120);if(error)continue;const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.src=data.signedUrl;img.alt='Photo enregistrée dans '+matiere;a.appendChild(img);const t=document.createElement('span');t.className='tiny';t.textContent=path.split('/').slice(2,-1).join(' / ')||'Document';a.appendChild(t);const card=document.createElement('div');card.append(a);photoOwnerControls(path,card);dest.appendChild(card)}if(announce)message(`${filtered.length} photo(s) dans ${matiere}.`)}

function detailView(d){let l=d.lessons.find(x=>x.id===lesson);if(!l){lesson=null;return lessonsView(d)}renderChapter(l.title,l)}
function cloudChapterView(){renderChapter(cloudChapter,null)}
function renderChapter(title,localLesson){const show=load(user).visible;app.innerHTML=toolbar()+`<button class="back" data-act="back-lesson">← ${safe(subject)}</button><div class="chapter-hero"><div class="eyebrow">${safe(user)} · ${safe(subject)} · CHAPITRE</div><div class="chapter-title">${safe(title)}</div></div><div class="doc-groups" id="chapterResources">${resourceCategories.map(c=>`<section class="doc-group"><h3>${categoryHeading(c)}</h3><p class="muted">Chargement…</p></section>`).join('')}</div>${localLesson&&show.cours?photoArea():''}<p class="note" style="margin-top:20px">Les documents Word, PDF et images ajoutés par Parent sont enregistrés en ligne. Les notes et les chapitres créés localement sur cet appareil ne sont pas encore synchronisés.</p>`;if(localLesson)bindPhotoControls();loadChapterResources(title)}
function categoryHeading(c){return ({cours:'📖 Cours',exercices:'✏️ Exercices',corriges:'✅ Corrigés',memos:'📝 Mémos / Synthèses'})[c]||c}
function readableFilename(path){let n=decodeURIComponent(path.split('/').pop());n=n.replace(/^\d{13}-[a-z0-9]{6}-/i,'').replace(/^\d{13}-[a-z0-9]{5,9}\./i,'photo.');return n.replace(/_/g,' ')}
async function loadChapterResources(title){const area=document.getElementById('chapterResources');if(!area)return;if(!authenticated()||isParent()){area.innerHTML='<p class="muted">Connecte-toi avec le compte de l’élève pour consulter les documents.</p>';return}const selected=user,mat=subject,id=currentId();const {paths,errors}=await listResourcesRecursive(`${id}/${slug(mat)}/${slug(title)}`);if(!area.isConnected||selected!==user||mat!==subject)return;if(errors.length){area.textContent='Impossible de charger les ressources : '+errors.join('; ');return}area.replaceChildren();for(const cat of resourceCategories){const section=document.createElement('section');section.className='doc-group';const heading=document.createElement('h3');heading.textContent=categoryHeading(cat);section.append(heading);const matching=paths.filter(p=>p.split('/')[3]===cat);if(!matching.length){const p=document.createElement('p');p.className='muted';p.textContent='Aucun document pour le moment.';section.append(p)}for(const path of matching){const {data,error}=await client.storage.from(resourcesBucket).createSignedUrl(path,300);if(error)continue;const a=document.createElement('a');a.className='file-link';a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='📎 '+readableFilename(path);section.append(a)}area.append(section)}}
function photoArea(){return `<div class="panel" style="margin-top:20px"><h3>📷 Photos de la leçon</h3><p class="hint">Plusieurs photos JPEG, PNG ou WebP, 10 Mo maximum par image. Les photos de cette leçon sont affichées séparément de celles des autres matières et leçons. Les anciennes photos non classées ne sont pas affichées dans une leçon différente.</p>${authenticated()?`<label>Ajouter des photos</label><input id="pictures" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="actions"><button class="primary" id="sendpics">Envoyer mes photos</button><button class="secondary" id="listpics">Actualiser mes documents</button></div><div id="msg" class="status" aria-live="polite"></div><div id="photos" class="photo-grid"></div>`:'<div class="warning">Connecte-toi avec ton compte Supabase pour envoyer et voir les documents.</div>'}</div>`}
function bindPhotoControls(){if(!authenticated()||!document.getElementById('pictures'))return;document.getElementById('sendpics').onclick=upload;document.getElementById('listpics').onclick=()=>listLessonPhotos(currentId(),subject,lesson,'photos');listLessonPhotos(currentId(),subject,lesson,'photos')}
function slug(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-|-$/g,'').slice(0,65)||'lecon'}
async function upload(){if(!authenticated())return message('Connexion nécessaire.');if(!isParent()&&user==='Parent')return message('Espace réservé au parent.');if(!isParent()&&session.user.email&&user!=='Parent'){/* Le compte est limité à son propre UID côté Supabase. Le prénom affiché ne constitue pas une authentification. */}const input=document.getElementById('pictures');const files=[...input.files];if(!files.length)return message('Choisis une ou plusieurs photos.');for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024)return message('Chaque image doit être JPEG, PNG ou WebP, 10 Mo maximum.')}const record=load(user).lessons.find(x=>x.id===lesson);const folder=`${currentId()}/${slug(subject)}/${slug(record?.title||'sans-titre')}`;message('Envoi en cours…');let sent=0;for(const f of files){const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg';const name=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,9)}.${ext}`;const {error}=await client.storage.from(bucket).upload(name,f,{contentType:f.type,upsert:false});if(error)return message(`${sent} photo(s) envoyée(s). Échec : ${error.message}`);sent++}message(`${sent} photo(s) sauvegardée(s) sur Supabase.`);input.value='';await listLessonPhotos(currentId(),subject,lesson,'photos',false)}
async function allPhotoPaths(uid){const results=[],errors=[];async function walk(prefix,depth){if(depth>5)return;let offset=0;do{const {data,error}=await client.storage.from(bucket).list(prefix,{limit:100,offset,sortBy:{column:'name',order:'asc'}});if(error){errors.push(error.message);return}const arr=data||[];for(const item of arr){if(!item.name||item.name.startsWith('.'))continue;const path=`${prefix}/${item.name}`;if(item.id){results.push(path)}else{await walk(path,depth+1)}}offset+=arr.length;if(arr.length<100)break}while(offset<2000)}await walk(uid,0);return {results,errors}}
async function listLessonPhotos(uid,matiere,lessonId,target,announce=true){

function parentResourcesPanel(){return `<div class="panel"><h2>📁 Ajouter des documents pédagogiques</h2><p class="muted">Choisis l'élève, la matière et le chapitre. Les documents seront accessibles dans la matière correspondante sur tous les appareils, une fois les autorisations Supabase configurées.</p><label>Élève</label><select id="resStudent"><option>Alexane</option><option>Clémence</option></select><label>Matière</label><select id="resSubject">${subjects.map(s=>`<option>${safe(s)}</option>`).join('')}</select><label>Chapitre existant</label><select id="resExistingChapter"><option value="">Chargement des chapitres…</option></select><label>Ou créer un nouveau chapitre</label><input id="resChapter" placeholder="Nouveau chapitre (facultatif)"><p class="hint">Sélectionne un chapitre existant, ou saisis un nouveau nom. Le titre du chapitre apparaît en grand ci-dessous.</p><label>Rubrique</label><select id="resCategory"><option value="cours">Cours</option><option value="exercices">Exercices</option><option value="corriges">Corrigés</option><option value="memos">Mémos / Synthèses</option></select><label>Ajouter un ou plusieurs fichiers</label><input id="resFiles" type="file" multiple accept=".pdf,.docx,.doc,.png,.jpg,.jpeg,.webp,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg,image/webp,text/plain"><label>Ou rédiger directement un document</label><textarea id="resText" placeholder="Écris ici un exercice, un corrigé, un rappel de cours…"></textarea><div class="actions"><button class="primary" id="resUpload">📤 Enregistrer dans le chapitre</button><button class="secondary" id="resRefresh">Voir les documents du chapitre</button></div><div id="resMessage" class="status" aria-live="polite">Les ressources nécessitent le bucket privé « ressources-pedagogiques » et ses règles de sécurité. Ne téléverse pas de document personnel avant leur vérification.</div><div id="resChapterOverview"></div><div id="resList"></div><p class="hint">Renommer ou supprimer nécessite les droits supplémentaires UPDATE et DELETE sur le bucket Supabase. Sans ces droits, les fichiers restent intacts et un message d’erreur s’affiche.</p></div>`}
const resourceTypes={'application/pdf':'pdf','application/msword':'doc','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx','image/jpeg':'jpg','image/png':'png','image/webp':'webp','text/plain':'txt'};
function resourcePath(uid,mat,chapter,category){return `${uid}/${slug(mat)}/${slug(chapter)}/${category}`}

function bindParentResources(){
 const up=document.getElementById('resUpload'),ref=document.getElementById('resRefresh');

async function refreshParentChapters(preferred=''){
 const person=document.getElementById('resStudent')?.value,mat=document.getElementById('resSubject')?.value;
 const picker=document.getElementById('resExistingChapter'),overview=document.getElementById('resChapterOverview'),list=document.getElementById('resList');
 if(!picker)return;
 picker.innerHTML='<option value="">Chargement…</option>';overview.replaceChildren();list.replaceChildren();
 const uid=parentUIDs[person];
 if(!uid){picker.innerHTML='<option value="">UID non enregistré</option>';resourceMessage('Saisis les UID dans « Consultation Parent », puis clique sur « Consulter les deux dossiers ».');return}
 const {paths,errors}=await listResourcesRecursive(`${uid}/${slug(mat)}`);
 if(person!==document.getElementById('resStudent')?.value||mat!==document.getElementById('resSubject')?.value)return;
 if(errors.length){picker.innerHTML='<option value="">Impossible de lire les chapitres</option>';resourceMessage(errors.join('; '));return}
 const chapters=new Map();
 for(const path of paths){const parts=path.split('/');if(parts.length>=5){const slugName=parts[2];if(!chapters.has(slugName))chapters.set(slugName,slugName.replace(/-/g,' '))}}
 const local=load(person).lessons.filter(x=>x.subject===mat);
 for(const x of local)if(!chapters.has(slug(x.title)))chapters.set(slug(x.title),x.title);
 picker.replaceChildren();
 const empty=new Option(chapters.size?'Choisir un chapitre':'Aucun chapitre existant', '');picker.add(empty);
 for(const [value,label] of chapters)picker.add(new Option(label,value));
 if(preferred&&chapters.has(slug(preferred)))picker.value=slug(preferred);
 else if(chapters.size)picker.selectedIndex=1;
 if(picker.value){document.getElementById('resChapter').value='';await showParentResources(false)}
 else resourceMessage('Crée un premier chapitre en saisissant son nom, puis ajoute un fichier.');
}

function resourceInputs(){const n=document.getElementById('resStudent')?.value,mat=document.getElementById('resSubject')?.value,chapter=(document.getElementById('resChapter')?.value.trim()||document.getElementById('resExistingChapter')?.value||''),category=document.getElementById('resCategory')?.value;const uid=parentUIDs[n];return {n,mat,chapter,category,uid}}
async function uploadResource(){if(!isParent())return resourceMessage('Connexion Parent requise.');const {n,mat,chapter,category,uid}=resourceInputs();if(!uid)return resourceMessage(`Renseigne d’abord l’UID de ${n} dans Consultation Parent, puis clique sur « Consulter les deux dossiers ». `);if(!chapter)return resourceMessage('Indique le chapitre.');const files=[...(document.getElementById('resFiles')?.files||[])];const typed=document.getElementById('resText').value.trim();if(!files.length&&!typed)return resourceMessage('Choisis un fichier ou rédige un texte.');if(typed)files.push(new File([typed],`texte-${Date.now()}.txt`,{type:'text/plain'}));for(const f of files){const ext=(f.name.split('.').pop()||'').toLowerCase();if(!['pdf','doc','docx','png','jpg','jpeg','webp','txt'].includes(ext)||f.size>10*1024*1024)return resourceMessage('Formats acceptés : PDF, Word, images ou TXT (10 Mo maximum par document).')}const prefix=resourcePath(uid,mat,chapter,category);resourceMessage(`Envoi vers ${n} → ${mat} → ${chapter} → ${category}…`);let done=0;for(const f of files){const filename=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-110);const object=`${prefix}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${filename}`;const {error}=await client.storage.from(resourcesBucket).upload(object,f,{contentType:f.type||'application/octet-stream',upsert:false});if(error)return resourceMessage(`Échec après ${done} fichier(s) : ${error.message}. Vérifie la configuration du bucket et ses règles.`);done++}document.getElementById('resFiles').value='';document.getElementById('resText').value='';resourceMessage(`${done} document(s) sauvegardé(s) pour ${n} dans ${mat} / ${chapter} / ${category}.`);await refreshParentChapters(chapter)}
async function listResourcesRecursive(prefix,depth=0){if(depth>5)return {paths:[],errors:[]};const paths=[],errors=[];let offset=0;while(true){const {data,error}=await client.storage.from(resourcesBucket).list(prefix,{limit:100,offset});if(error){errors.push(error.message);break}const items=data||[];for(const item of items){if(!item.name||item.name.startsWith('.'))continue;const full=prefix+'/'+item.name;if(item.id)paths.push(full);else{const sub=await listResourcesRecursive(full,depth+1);paths.push(...sub.paths);errors.push(...sub.errors)}}if(items.length<100)break;offset+=100}return {paths,errors}}
function resourceLabel(path){let p=path.split('/');return p.slice(2,5).map(x=>x.replace(/-/g,' ')).join(' → ')}
async function displayResources(paths,container){
 container.replaceChildren();
 if(!paths.length){container.textContent='Aucun document pour le moment.';return}
 for(const path of paths){
  const {data,error}=await client.storage.from(resourcesBucket).createSignedUrl(path,300);
  if(error)continue;
  const item=document.createElement('div');item.className='resource-entry';
  const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='📄 '+readableFilename(path);
  const actions=document.createElement('div');actions.className='resource-buttons';
  const ren=document.createElement('button');ren.className='secondary';ren.textContent='✏️ Renommer';ren.type='button';ren.onclick=()=>renameResource(path);
  const del=document.createElement('button');del.className='danger';del.textContent='🗑 Supprimer';del.type='button';del.onclick=()=>deleteResource(path);
  actions.append(ren,del);item.append(a,actions);container.append(item);
 }
}
function cleanNewFilename(input,oldPath){
 const old=oldPath.split('/').pop();const extension=(old.match(/\.[a-z0-9]{1,8}$/i)||[''])[0];
 let name=String(input||'').trim().replace(/[\\/\x00-\x1f<>:"|?*]/g,'').replace(/\s+/g,'_');
 if(!name)return '';
 if(extension && name.toLowerCase().endsWith(extension.toLowerCase()))name=name.slice(0,-extension.length);
 name=name.replace(/\.+$/,'').slice(0,100);
 if(!name)return '';
 return name+extension;
}
async function renameResource(path){
 if(!isParent())return resourceMessage('Accès Parent nécessaire.');
 const displayName=readableFilename(path);
 const wanted=window.prompt('Nouveau nom du document (extension conservée) :',displayName);
 if(wanted===null)return;
 const next=cleanNewFilename(wanted,path);
 if(!next)return resourceMessage('Nom de fichier invalide.');
 const folder=path.slice(0,path.lastIndexOf('/')+1);
 const old=path.split('/').pop();
 const filename=old.replace(/^(\d{13}-[a-z0-9]{6}-)/i,'');
 const prefix=old.slice(0,old.length-filename.length);
 const target=folder+prefix+next;
 if(target===path)return resourceMessage('Aucun changement de nom.');
 if(!window.confirm('Renommer « '+displayName+' » en « '+next+' » ?'))return;
 resourceMessage('Renommage en cours…');
 const {error}=await client.storage.from(resourcesBucket).move(path,target);
 if(error)return resourceMessage('Renommage impossible : '+error.message+'. Vérifie la règle UPDATE sur Supabase.');
 resourceMessage('Document renommé.');await showParentResources(false);
}
async function deleteResource(path){
 if(!isParent())return resourceMessage('Accès Parent nécessaire.');
 const name=readableFilename(path);
 if(!window.confirm('Supprimer définitivement « '+name+' » ? Cette action est irréversible.'))return;
 resourceMessage('Suppression en cours…');
 const {data,error}=await client.storage.from(resourcesBucket).remove([path]);
 if(error)return resourceMessage('Suppression impossible : '+error.message+'. Vérifie la règle DELETE sur Supabase.');
 if(!data||!data.length)return resourceMessage('La suppression n’a pas été confirmée par le stockage.');
 resourceMessage('Document supprimé définitivement.');await showParentResources(false);
}

}
async function loadStudentResources(){const el=document.getElementById('chapterList');if(!el||!authenticated()||isParent())return;const originalUser=user,originalSubject=subject,uid=currentId();const {paths,errors}=await listResourcesRecursive(`${uid}/${slug(originalSubject)}`);if(!el.isConnected||originalUser!==user||originalSubject!==subject)return;if(errors.length){el.innerHTML='<p class="muted">Impossible de charger les chapitres en ligne.</p>';return}const titles=new Map();for(const path of paths){const parts=path.split('/');if(parts.length>=5){const ch=parts[2];if(!titles.has(ch))titles.set(ch,ch.replace(/-/g,' '))}}const local=load(user).lessons.filter(l=>l.subject===subject);const localSlugs=new Set(local.map(l=>slug(l.title)));const remote=[...titles.entries()].filter(([slugName])=>!localSlugs.has(slugName));el.innerHTML=local.map(l=>`<button class="chapter-card" data-open="${safe(l.id)}"><strong>📖 ${safe(l.title)}</strong><span>→</span></button>`).join('')+remote.map(([slugName,title])=>`<button class="chapter-card" data-chapter="${safe(slugName)}"><strong>📖 ${safe(title)}</strong><span>→</span></button>`).join('')||'<p class="muted">Aucun chapitre pour le moment.</p>'}
function settings(){app.innerHTML=`<button class="back" data-act="back-settings">← Retour</button><div class="panel authbox"><h2>🔐 Connexion à Apprendre Ensemble</h2><p class="muted">Le site est déjà relié à Supabase. Utilise seulement ton adresse e-mail et ton mot de passe personnel.</p>${authenticated()?`<p class="status">Connecté : ${safe(session.user.email)}</p>`:''}<label>E-mail</label><input id="email" type="email" autocomplete="username" placeholder="Ton adresse e-mail"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" placeholder="Ton mot de passe"><div class="actions"><button class="primary" id="signin">Se connecter</button><button class="secondary" id="signout">Se déconnecter</button></div><div id="msg" class="status" aria-live="polite"></div><p class="hint">Les documents sont protégés par les autorisations de ton compte Supabase. Ne partage pas ton mot de passe.</p></div>`;document.getElementById('signin').onclick=async()=>{if(!client)return message('Connexion au service indisponible. Vérifie ta connexion Internet puis actualise la page.');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return message('Indique ton e-mail et ton mot de passe.');message('Connexion en cours…');const {data,error}=await client.auth.signInWithPassword({email,password});document.getElementById('password').value='';if(error)return message('Connexion refusée : '+error.message);session=data.session;message('Connexion réussie.');setTimeout(()=>render(),450)};document.getElementById('signout').onclick=logout}
async function logout(){if(client)await client.auth.signOut();session=null;render()}
document.body.addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;if(x.dataset.user){user=x.dataset.user;subject=null;lesson=null;cloudChapter=null;render()}else if(x.dataset.subject){subject=x.dataset.subject;lesson=null;cloudChapter=null;render()}else if(x.dataset.open){cloudChapter=null;lesson=x.dataset.open;subject=load(user).lessons.find(l=>l.id===lesson)?.subject;render()}else if(x.dataset.chapter){cloudChapter=x.dataset.chapter.replace(/-/g,' ');lesson=null;render()}else if(x.dataset.act==='back-subject'){subject=null;lesson=null;cloudChapter=null;render()}else if(x.dataset.act==='back-lesson'){lesson=null;cloudChapter=null;render()}else if(x.dataset.act==='settings'){settings()}else if(x.dataset.act==='back-settings'){render()}else if(x.dataset.act==='logout'){logout()}});
try{const params=new URLSearchParams(location.search);const who=params.get('eleve'),mat=params.get('matiere');if(['Alexane','Clémence'].includes(who)&&subjects.includes(mat)){user=who;subject=mat}}catch{}init();render();
