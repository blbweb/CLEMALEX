<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apprendre Ensemble · Version 7</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#263349;background:#f6f7fb;--a:#6258c8;--border:#e5e6ee}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9e98e6}header{background:white;border-bottom:1px solid var(--border)}.wrap{max-width:1120px;margin:auto;padding:0 22px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;font-size:21px;color:#31285e}.brand span{display:inline-grid;place-items:center;width:39px;height:39px;border-radius:13px;background:#efedff;margin-right:8px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button,.subtle{background:#f0eff9;color:#4b426d;padding:10px 15px;border-radius:12px;font-weight:700}.tabs button.active,.primary{background:var(--a);color:white}.hero{padding:38px 0 22px}.eyebrow{color:var(--a);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:800}h1{font-size:clamp(28px,4vw,38px);margin:10px 0;color:#30294d}h2{font-size:22px;color:#30294d}h3{margin:0 0 6px;font-size:17px}.muted{color:#69738a}p{line-height:1.55}main{padding-bottom:50px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:180px;padding:13px 15px;border:1px solid var(--border);border-radius:12px;background:#fff}.primary{border-radius:12px;padding:12px 16px;font-weight:750}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card,.panel{background:white;border:1px solid var(--border);border-radius:19px;padding:21px;box-shadow:0 8px 22px #25254409}.card{min-height:135px;text-align:left;display:flex;flex-direction:column;gap:10px}.symbol{font-size:27px}.tag{display:inline-block;border-radius:99px;background:#edeafd;padding:6px 10px;font-size:12px;color:#5148a8;font-weight:700}.back{padding:0;background:transparent;color:var(--a);font-weight:750;margin-bottom:15px}.blockgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:14px}.block{border:1px solid var(--border);padding:19px;border-radius:16px;background:#fff;min-height:150px}.block .symbol{display:block;margin-bottom:12px}.panel{margin-bottom:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.lesson{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;border:1px solid var(--border);border-radius:12px;background:#fff}.lesson:hover,.card:hover{border-color:#aba3ee}.pill{padding:5px 10px;border-radius:50px;background:#e7f7ee;color:#17754a;font-size:12px}label{display:block;margin:12px 0 5px;font-weight:700;font-size:14px}input,select,textarea{padding:12px;border:1px solid #dcdfea;border-radius:10px;width:100%;background:#fff}textarea{min-height:100px}.check{display:flex;align-items:center;gap:8px;margin:10px 0}.check input{width:auto}.note{border-left:4px solid #b6a8ee;padding:12px 16px;background:#f2efff;border-radius:9px;font-size:14px}.hidden{display:none!important}.empty{border:2px dashed #dcdde9;background:#fafaff;padding:23px;border-radius:15px;color:#667089}.tiny{font-size:12px}.doc{display:inline-block;padding:9px 12px;background:#f0eff9;border-radius:10px;margin:4px 5px 4px 0}footer{padding:25px 0;color:#72768d;font-size:12px}@media(max-width:650px){.top{height:auto;padding:18px 0;align-items:flex-start;flex-direction:column}.tabs{width:100%}.tabs button{flex:1}.hero{padding-top:25px}.wrap{padding:0 15px}}

.authbox{max-width:580px}.status{font-size:13px;padding:12px;border-radius:10px;background:#edf2ff;margin:12px 0;white-space:pre-wrap}.warning{background:#fff5dd;color:#725308;padding:14px;border-radius:12px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.photo-grid img{width:100%;height:150px;object-fit:cover;border-radius:12px;cursor:pointer}.photo-grid a{display:block;word-break:break-word}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0} .secondary{background:#eeebfb;color:#443a96;border-radius:12px;padding:10px 14px;font-weight:700}.wide{max-width:770px}.lesson-head{margin-bottom:16px}.hint{font-size:13px;color:#6b7285} .boxline{border-top:1px solid #eee;padding-top:14px;margin-top:14px} .mobile-panel{background:#f5f2ff;border:1px solid #d9d3ff;border-radius:17px;padding:20px;margin:18px 0}.qrwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.qrwrap canvas,.qrwrap img{border:8px solid white;border-radius:10px;max-width:180px}.mobile-link{overflow-wrap:anywhere;font-size:13px}.photo-grid a{display:flex;flex-direction:column;gap:5px}.photo-grid a span{overflow-wrap:anywhere}.mobile-panel .actions button{min-height:45px}@media(max-width:650px){.qrwrap{justify-content:center}} </style></head><body><header><div class="wrap top"><div class="brand"><span>🎓</span>Apprendre Ensemble</div><nav class="tabs"><button data-user="Alexane">Alexane</button><button data-user="Clémence">Clémence</button><button data-user="Parent">Parent ⚙</button></nav></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Bibliothèque pédagogique · Seconde</div><h1 id="welcome"></h1><p id="description" class="muted"></p></section><div id="app"></div></main><footer class="wrap">V7 – Prototype familial : photographies privées sur Supabase ; contenus pédagogiques et réglages conservés localement sur cet appareil. Pas d’IA automatique.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const subjects=['Mathématiques','Physique-Chimie','SVT','Français','Histoire-Géographie','Anglais','Espagnol','SES','SNT','Autre'];
const icons={'Mathématiques':'📐','Physique-Chimie':'⚗️','SVT':'🌿','Français':'📚','Histoire-Géographie':'🌍','Anglais':'💬','Espagnol':'🗣️','SES':'📈','SNT':'💻','Autre':'🗂️'};
const blocks=[['cours','📖','Leçon'],['exercices','✏️','Exercices'],['corrige','✅','Corrigé'],['memo','📝','Mémo / Synthèse']];
const seed=()=>({subjects:['Mathématiques'],lessons:[],visible:{cours:true,exercices:true,corrige:true,memo:true}});
const key='ae_v4_library_'; const cfgKey='ae_v5_public_config';
const load=n=>{try{return {...seed(),...JSON.parse(localStorage.getItem(key+n)||'{}')}}catch{return seed()}};
const save=(n,v)=>localStorage.setItem(key+n,JSON.stringify(v));
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');let user='Alexane',subject=null,lesson=null,client=null,session=null,authEmail='',parentUIDs={Alexane:'',Clémence:''};
const publicSite='https://blbweb.github.io/CLEMALEX/';const bucket='documents eleves';const parentUserId='4a305a54-fcbf-427e-9294-4cf9b7eff101';const idsKey='ae_v6_student_uids';try{parentUIDs={...parentUIDs,...JSON.parse(localStorage.getItem(idsKey)||'{}')}}catch{};let cfg={url:'',key:''};try{cfg={...cfg,...JSON.parse(localStorage.getItem(cfgKey)||'{}')}}catch{}
function init(){if(cfg.url&&cfg.key&&window.supabase){try{client=window.supabase.createClient(cfg.url,cfg.key);client.auth.getSession().then(({data})=>{session=data.session;render()}).catch(e=>message(e.message))}catch(e){message(e.message)}}}
function currentId(){return session?.user?.id||''}
function message(t){const e=document.getElementById('msg');if(e)e.textContent=t}
function authenticated(){return !!session}
function isParent(){return authenticated()&&currentId()===parentUserId}
function toolbar(){return `<div class="actions"><button class="secondary" data-act="settings">⚙ Connexion Supabase</button>${authenticated()?`<span class="tag">Connecté : ${safe(session.user.email)}</span><button class="secondary" data-act="logout">Déconnexion</button>`:'<span class="tag">Mode maquette : non connecté</span>'}</div>`}
function render(){document.querySelectorAll('[data-user]').forEach(b=>b.classList.toggle('active',b.dataset.user===user));document.getElementById('welcome').textContent=user==='Parent'?'Organisons les ressources':`Bonjour ${user} 👋`;document.getElementById('description').textContent=user==='Parent'?'Les matières et les contenus sont configurables, sans notes ni classement.':'Retrouve les leçons, exercices, corrigés et mémos facilement.';if(user==='Parent')return parentView();const d=load(user);if(!subject)return subjectsView(d);if(!lesson)return lessonsView(d);return detailView(d)}
function subjectsView(d){app.innerHTML=toolbar()+`<div class="toolbar"><input id="search" placeholder="🔎 Rechercher une matière ou une leçon"><span class="muted tiny">${d.subjects.length} matière(s)</span></div><div class="cards">${d.subjects.map(s=>`<button class="card" data-subject="${safe(s)}"><span class="symbol">${icons[s]||'📁'}</span><h3>${safe(s)}</h3><span class="muted tiny">${d.lessons.filter(l=>l.subject===s).length} leçon(s)</span></button>`).join('')}</div><div class="panel" style="margin-top:22px"><h3>Mes dernières leçons</h3>${d.lessons.slice(-5).reverse().map(l=>`<button class="lesson" data-open="${safe(l.id)}">${safe(l.subject)} → <b>${safe(l.title)}</b></button>`).join('')||'<p class="muted">Aucune leçon ajoutée pour le moment.</p>'}</div>`;document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-subject],[data-open]').forEach(b=>b.classList.toggle('hidden',!b.textContent.toLowerCase().includes(q)))}}
function lessonsView(d){const arr=d.lessons.filter(l=>l.subject===subject);app.innerHTML=toolbar()+`<button class="back" data-act="back-subject">← Toutes les matières</button><h2>${icons[subject]||'📁'} ${safe(subject)}</h2>${subjectMobileArea()}<div class="panel"><h3>📂 Documents de ${safe(subject)}</h3><p class="hint">Toutes les photos de cette matière apparaissent ici, même sans chapitre créé. Les documents des autres matières ne s'affichent pas.</p><div id="msg" class="status" aria-live="polite"></div><div id="subjectPhotos" class="photo-grid"></div></div><div class="panel"><h3>Leçons et exercices</h3>${arr.map(l=>`<button class="lesson" data-open="${safe(l.id)}">${safe(l.title)} <span class="muted tiny">${safe(l.date)}</span></button>`).join('')||'<div class="empty">Aucune leçon ajoutée pour le moment. Tu peux déjà déposer des photos dans cette matière.</div>'}</div>`;bindSubjectMobile();if(authenticated()&&!isParent())listSubjectPhotos(currentId(),subject,'subjectPhotos');else if(authenticated()&&isParent()){document.getElementById('subjectPhotos').textContent='La consultation des documents des filles se fait dans l’espace Parent.'}else{document.getElementById('subjectPhotos').textContent='Connecte-toi à ton compte Supabase pour consulter tes photos.'}}
function subjectMobileArea(){const url=new URL(publicSite);url.searchParams.set('eleve',user);url.searchParams.set('matiere',subject);const link=url.toString();return `<div class="mobile-panel"><h3>📱 Envoyer depuis mon téléphone</h3><p>La photo sera enregistrée dans <b>${safe(user)} → ${safe(subject)}</b>, pas dans une autre matière.</p><div class="actions"><button class="secondary" id="showQR">Afficher le QR code</button><a class="secondary" href="${safe(link)}" target="_blank" rel="noopener noreferrer">Ouvrir la version mobile ↗</a></div><div class="qrwrap hidden" id="qrArea"><div id="qrCanvas" aria-label="QR code d’accès à la matière"></div><div><p class="hint">Scanne ce code avec le téléphone pour ouvrir cette matière.</p><a class="mobile-link" href="${safe(link)}" target="_blank" rel="noopener noreferrer">${safe(link)}</a><p class="hint">Une connexion au compte personnel reste nécessaire.</p></div></div>${authenticated()&&!isParent()?`<label>Prendre une photo ou choisir plusieurs images</label><input id="subjectPictures" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="actions"><button class="primary" id="subjectUpload">Enregistrer dans ${safe(subject)}</button><button class="secondary" id="refreshSubject">Actualiser les photos</button></div>`:'<p class="warning">Connecte-toi avec le compte de l’élève pour envoyer les photos.</p>'}</div>`}
function bindSubjectMobile(){const qr=document.getElementById('showQR');if(qr)qr.onclick=()=>{const box=document.getElementById('qrArea');box.classList.toggle('hidden');if(!box.classList.contains('hidden')){const url=new URL(publicSite);url.searchParams.set('eleve',user);url.searchParams.set('matiere',subject);const el=document.getElementById('qrCanvas');el.innerHTML='';if(window.QRCode)new QRCode(el,{text:url.toString(),width:160,height:160,correctLevel:QRCode.CorrectLevel.M});else el.textContent='QR code indisponible hors connexion. Utilise le lien ci-contre.'}};const up=document.getElementById('subjectUpload');if(up)up.onclick=uploadSubject;const re=document.getElementById('refreshSubject');if(re)re.onclick=()=>listSubjectPhotos(currentId(),subject,'subjectPhotos')}
async function uploadSubject(){const el=document.getElementById('subjectPictures');const files=[...(el?.files||[])];if(!authenticated())return message('Connecte-toi d’abord.');if(isParent())return message('Utilise un compte élève pour ce dépôt.');if(!files.length)return message('Choisis au moins une photo.');for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10*1024*1024)return message('Formats acceptés : JPG, PNG ou WebP, 10 Mo maximum par photo.')}const folder=`${currentId()}/${slug(subject)}/non-classe`;let count=0;message('Envoi en cours…');for(const f of files){const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg';const filename=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,10)}.${ext}`;const {error}=await client.storage.from(bucket).upload(filename,f,{contentType:f.type,upsert:false});if(error)return message(`${count} fichier(s) envoyé(s). Erreur : ${error.message}`);count++}el.value='';message(`${count} photo(s) enregistrée(s) dans ${subject}.`);await listSubjectPhotos(currentId(),subject,'subjectPhotos',false)}
async function listSubjectPhotos(uid,matiere,target,announce=true){const dest=document.getElementById(target);if(!dest||!client||!uid)return;if(announce)message('Chargement des photos de '+matiere+'…');dest.innerHTML='';const {results,errors}=await allPhotoPaths(uid);if(errors.length){dest.textContent='Impossible de charger les photos : '+errors[0];return}const base=slug(matiere);const filtered=results.filter(p=>p.split('/')[1]===base);if(!filtered.length){dest.innerHTML='<p class="muted">Aucune photo dans cette matière pour le moment.</p>';if(announce)message('Aucune photo trouvée dans '+matiere+'.');return}for(const path of filtered){const {data,error}=await client.storage.from(bucket).createSignedUrl(path,120);if(error)continue;const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.src=data.signedUrl;img.alt='Photo enregistrée dans '+matiere;a.appendChild(img);const t=document.createElement('span');t.className='tiny';t.textContent=path.split('/').slice(2,-1).join(' / ')||'Document';a.appendChild(t);dest.appendChild(a)}if(announce)message(`${filtered.length} photo(s) dans ${matiere}.`)}

function detailView(d){let l=d.lessons.find(x=>x.id===lesson);if(!l){lesson=null;return lessonsView(d)}let show=d.visible;app.innerHTML=toolbar()+`<button class="back" data-act="back-lesson">← ${safe(subject)}</button><div class="row lesson-head"><div><span class="tag">${safe(subject)}</span><h2>${safe(l.title)}</h2></div><span class="tiny muted">${safe(l.date)}</span></div><div class="blockgrid">${blocks.filter(b=>show[b[0]]).map(([id,icon,title])=>`<section class="block"><span class="symbol">${icon}</span><h3>${title}</h3>${id==='cours'?'<p class="tiny muted">Photos et documents du cours</p>':`<p class="tiny muted">${safe(l[id]||'Aucun contenu ajouté pour le moment.')}</p>`}</section>`).join('')}</div>${show.cours?photoArea():''}<div class="note">Les photos sont sauvegardées sur Supabase uniquement si tu es connecté. Les matières, leçons et contenus rédigés dans cette V5 sont stockés dans ce navigateur et ne se synchronisent pas encore entre appareils.</div>`;bindPhotoControls()}
function photoArea(){return `<div class="panel" style="margin-top:20px"><h3>📷 Photos de la leçon</h3><p class="hint">Plusieurs photos JPEG, PNG ou WebP, 10 Mo maximum par image. Les documents sont rangés dans ton dossier Supabase, par matière puis par titre de leçon. Les anciens documents restent accessibles dans la rubrique « Autres photos ».</p>${authenticated()?`<label>Ajouter des photos</label><input id="pictures" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="actions"><button class="primary" id="sendpics">Envoyer mes photos</button><button class="secondary" id="listpics">Actualiser mes documents</button></div><div id="msg" class="status" aria-live="polite"></div><div id="photos" class="photo-grid"></div>`:'<div class="warning">Connecte-toi avec ton compte Supabase pour envoyer et voir les documents.</div>'}</div>`}
function bindPhotoControls(){if(!authenticated()||!document.getElementById('pictures'))return;document.getElementById('sendpics').onclick=upload;document.getElementById('listpics').onclick=()=>listPhotos(currentId(),'photos');listPhotos(currentId(),'photos')}
function slug(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-|-$/g,'').slice(0,65)||'lecon'}
async function upload(){if(!authenticated())return message('Connexion nécessaire.');if(!isParent()&&user==='Parent')return message('Espace réservé au parent.');if(!isParent()&&session.user.email&&user!=='Parent'){/* Le compte est limité à son propre UID côté Supabase. Le prénom affiché ne constitue pas une authentification. */}const input=document.getElementById('pictures');const files=[...input.files];if(!files.length)return message('Choisis une ou plusieurs photos.');for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024)return message('Chaque image doit être JPEG, PNG ou WebP, 10 Mo maximum.')}const record=load(user).lessons.find(x=>x.id===lesson);const folder=`${currentId()}/${slug(subject)}/${slug(record?.title||'sans-titre')}`;message('Envoi en cours…');let sent=0;for(const f of files){const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg';const name=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,9)}.${ext}`;const {error}=await client.storage.from(bucket).upload(name,f,{contentType:f.type,upsert:false});if(error)return message(`${sent} photo(s) envoyée(s). Échec : ${error.message}`);sent++}message(`${sent} photo(s) sauvegardée(s) sur Supabase.`);input.value='';await listPhotos(currentId(),'photos',false)}
async function allPhotoPaths(uid){const results=[],errors=[];async function walk(prefix,depth){if(depth>5)return;let offset=0;do{const {data,error}=await client.storage.from(bucket).list(prefix,{limit:100,offset,sortBy:{column:'name',order:'asc'}});if(error){errors.push(error.message);return}const arr=data||[];for(const item of arr){if(!item.name||item.name.startsWith('.'))continue;const path=`${prefix}/${item.name}`;if(item.id){results.push(path)}else{await walk(path,depth+1)}}offset+=arr.length;if(arr.length<100)break}while(offset<2000)}await walk(uid,0);return {results,errors}}
async function listPhotos(uid,target,announce=true){const dest=document.getElementById(target);if(!dest||!client)return;if(announce)message('Chargement des documents…');dest.innerHTML='';if(!uid){dest.innerHTML='<p class="muted">Identifiant manquant.</p>';return}const {results,errors}=await allPhotoPaths(uid);if(errors.length){dest.textContent='Accès refusé ou erreur de lecture : '+errors[0];if(announce)message('Impossible de lire ces documents.');return}if(!results.length){dest.innerHTML='<p class="muted">Aucune photo trouvée pour ce dossier.</p>';if(announce)message('Dossier consulté.');return}for(const path of results){const {data,error}=await client.storage.from(bucket).createSignedUrl(path,120);if(error)continue;const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';a.title=path;const img=document.createElement('img');img.src=data.signedUrl;img.alt='Photo de cours : '+path.split('/').slice(1).join(' / ');a.appendChild(img);const label=document.createElement('span');label.className='tiny';label.textContent=path.split('/').slice(1,-1).join(' / ')||'Photo non classée';a.appendChild(label);dest.appendChild(a)}if(announce)message(`${results.length} fichier(s) trouvé(s).`)}
function parentView(){const ok=isParent();app.innerHTML=toolbar()+`<div class="panel"><h2>⚙️ Matières et blocs visibles</h2><p class="muted">Chaque espace a ses propres réglages, enregistrés sur cet appareil uniquement.</p>${ok?'<label>Choisir l’espace</label><select id="target"><option>Alexane</option><option>Clémence</option></select><div id="manage"></div>':'<div class="warning">Réglages Parent réservés au compte Parent connecté. Le bouton Parent ne donne aucun droit à lui seul.</div>'}</div><div class="panel"><h2>📷 Consultation Parent</h2>${ok?`<p class="hint">Pour la première utilisation, renseigne les UID des comptes d’Alexane et Clémence (Supabase → Authentication → Users). Ils sont mémorisés dans ce navigateur, jamais publiés sur GitHub. Seul ton compte autorisé par Supabase peut voir leurs documents.</p><label>UID Alexane</label><input id="uidA" value="${safe(parentUIDs.Alexane)}" placeholder="UID Alexane"><label>UID Clémence</label><input id="uidC" value="${safe(parentUIDs.Clémence)}" placeholder="UID Clémence"><div class="actions"><button class="primary" id="parentList">Consulter les deux dossiers</button></div><div id="msg" class="status" aria-live="polite"></div><h3>Alexane</h3><div id="photosA" class="photo-grid"></div><h3 style="margin-top:18px">Clémence</h3><div id="photosC" class="photo-grid"></div>`:'<p class="warning">Connecte-toi avec le compte Parent pour consulter les documents des filles. Les réglages et les accès Supabase seront contrôlés séparément.</p>'}</div><div class="note">Important : les boutons Alexane, Clémence et Parent servent à naviguer, pas à se connecter. Les autorisations reposent sur la connexion Supabase et ses règles de sécurité. N’utilise que des photos fictives tant que les tests d’isolation des comptes ne sont pas terminés.</div>`;if(ok){document.getElementById('target').onchange=manage;manage();document.getElementById('parentList').onclick=async()=>{const a=document.getElementById('uidA').value.trim(),c=document.getElementById('uidC').value.trim();const valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;if(!valid.test(a)||!valid.test(c))return message('Indique les deux UID complets.');parentUIDs={Alexane:a,Clémence:c};localStorage.setItem(idsKey,JSON.stringify(parentUIDs));message('Consultation en cours…');await listPhotos(a,'photosA',false);await listPhotos(c,'photosC',false);message('Consultation terminée (vérifie les éventuelles erreurs affichées).')}}}
function manage(){const n=document.getElementById('target').value,d=load(n);document.getElementById('manage').innerHTML=`<h3 style="margin-top:22px">Matières de ${n}</h3>${subjects.map(s=>`<label class="check"><input type="checkbox" data-mat="${safe(s)}" ${d.subjects.includes(s)?'checked':''}> ${icons[s]} ${safe(s)}</label>`).join('')}<h3 style="margin-top:22px">Blocs affichés</h3>${blocks.map(([id,icon,t])=>`<label class="check"><input type="checkbox" data-block="${id}" ${d.visible[id]?'checked':''}> ${icon} ${t}</label>`).join('')}<h3 style="margin-top:22px">Ajouter une leçon</h3><label>Matière</label><select id="newsubject">${d.subjects.map(s=>`<option>${safe(s)}</option>`).join('')}</select><label>Titre</label><input id="newtitle" placeholder="Ex. Les fonctions affines"><label>Note facultative</label><textarea id="newnote"></textarea><div class="actions"><button class="primary" id="addLesson">Ajouter la leçon</button></div><div id="feedback" class="hint"></div><h3>Contenus des leçons</h3>${d.lessons.map(l=>`<div class="boxline"><b>${safe(l.subject)} – ${safe(l.title)}</b><label>Exercices</label><textarea data-content="exercices" data-id="${safe(l.id)}">${safe(l.exercices||'')}</textarea><label>Corrigé</label><textarea data-content="corrige" data-id="${safe(l.id)}">${safe(l.corrige||'')}</textarea><label>Mémo / Synthèse</label><textarea data-content="memo" data-id="${safe(l.id)}">${safe(l.memo||'')}</textarea><button class="secondary" data-save="${safe(l.id)}">Enregistrer le contenu</button></div>`).join('')||'<p class="hint">Ajoute une leçon pour rédiger ses contenus.</p>'}<p class="warning">Ces contenus sont stockés localement pour cette démonstration ; ils ne sont pas encore publiés en ligne pour les filles.</p>`;document.querySelectorAll('[data-mat]').forEach(x=>x.onchange=()=>{d.subjects=x.checked?[...new Set([...d.subjects,x.dataset.mat])]:d.subjects.filter(s=>s!==x.dataset.mat);save(n,d);manage()});document.querySelectorAll('[data-block]').forEach(x=>x.onchange=()=>{d.visible[x.dataset.block]=x.checked;save(n,d)});document.getElementById('addLesson').onclick=()=>{let t=document.getElementById('newtitle').value.trim(),s=document.getElementById('newsubject').value,note=document.getElementById('newnote').value.trim();if(!t)return document.getElementById('feedback').textContent='Indique un titre.';d.lessons.push({id:crypto.randomUUID(),subject:s,title:t,note,date:new Date().toLocaleDateString('fr-FR')});save(n,d);manage()};document.querySelectorAll('[data-save]').forEach(btn=>btn.onclick=()=>{let l=d.lessons.find(x=>x.id===btn.dataset.save);for(const type of ['exercices','corrige','memo'])l[type]=document.querySelector(`[data-content="${type}"][data-id="${btn.dataset.save}"]`).value;save(n,d);btn.textContent='Enregistré dans ce navigateur ✓'})}
function settings(){app.innerHTML=`<button class="back" data-act="back-settings">← Retour</button><div class="panel authbox"><h2>⚙️ Connexion Supabase</h2><p class="muted">Ces informations publiques sont enregistrées uniquement dans ce navigateur.</p><label>Adresse du projet (Project URL)</label><input id="url" value="${safe(cfg.url)}" placeholder="https://xxxxxxxx.supabase.co"><label>Publishable key</label><input id="key" value="${safe(cfg.key)}" placeholder="sb_publishable_..."><p class="warning">N'insère jamais de secret key, service_role ou mot de passe administrateur dans ces champs.</p><button class="primary" id="savecfg">Enregistrer la connexion</button></div><div class="panel authbox"><h2>Se connecter</h2><label>E-mail</label><input id="email" type="email" placeholder="Adresse du compte Supabase"><label>Mot de passe</label><input id="password" type="password" placeholder="Mot de passe"><div class="actions"><button class="primary" id="signin">Connexion</button><button class="secondary" id="signout">Déconnexion</button></div><p class="hint">Choisis ensuite l'espace correspondant au compte utilisé. Le choix de prénom seul ne crée aucun droit d'accès.</p><div id="msg" class="status"></div></div>`;document.getElementById('savecfg').onclick=()=>{const url=document.getElementById('url').value.trim(),key=document.getElementById('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key.startsWith('sb_publishable_'))return message('Vérifie l’URL et la clé publique sb_publishable_.');cfg={url,key};localStorage.setItem(cfgKey,JSON.stringify(cfg));client=null;session=null;init();message('Configuration enregistrée. Tu peux te connecter.')};document.getElementById('signin').onclick=async()=>{if(!client)return message('Enregistre d’abord une URL et une clé publique.');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await client.auth.signInWithPassword({email,password});document.getElementById('password').value='';if(error)return message('Connexion refusée : '+error.message);session=data.session;message('Connexion réussie.');setTimeout(()=>render(),450)};document.getElementById('signout').onclick=logout}
async function logout(){if(client)await client.auth.signOut();session=null;render()}
document.body.addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;if(x.dataset.user){user=x.dataset.user;subject=null;lesson=null;render()}else if(x.dataset.subject){subject=x.dataset.subject;lesson=null;render()}else if(x.dataset.open){lesson=x.dataset.open;subject=load(user).lessons.find(l=>l.id===lesson)?.subject;render()}else if(x.dataset.act==='back-subject'){subject=null;lesson=null;render()}else if(x.dataset.act==='back-lesson'){lesson=null;render()}else if(x.dataset.act==='settings'){settings()}else if(x.dataset.act==='back-settings'){render()}else if(x.dataset.act==='logout'){logout()}});
try{const params=new URLSearchParams(location.search);const who=params.get('eleve'),mat=params.get('matiere');if(['Alexane','Clémence'].includes(who)&&subjects.includes(mat)){user=who;subject=mat}}catch{}init();render();
</script></body></html>
