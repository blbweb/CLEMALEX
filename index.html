function photoOwnerControls(path, card){
  if(!authenticated()||isParent()||!path.startsWith(currentId()+'/'))return;
  const controls=document.createElement('div');controls.className='actions';
  const rename=document.createElement('button');rename.className='secondary';rename.type='button';rename.textContent='✏️ Renommer';
  rename.onclick=async()=>{
    const old=path.split('/').pop(), current=old.replace(/^\d{13}-[a-z0-9]+-/i,'');
    const requested=prompt('Nouveau nom du fichier (garde l’extension) :',current);
    if(requested===null)return;
    const name=requested.trim().replace(/[^a-zA-Z0-9._-]/g,'_');
    if(!name||name==='.'||name==='..'||name.includes('..')||name.length>110){alert('Nom invalide.');return}
    if(name.split('.').pop().toLowerCase()!==old.split('.').pop().toLowerCase()){alert('Conserve le format du fichier (extension).');return}
    const target=path.slice(0,path.lastIndexOf('/')+1)+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+name;
    if(!confirm('Renommer ce document ?'))return;
    const {error}=await client.storage.from(bucket).move(path,target);
    if(error){alert('Impossible de renommer : '+error.message+'\nVérifie les droits UPDATE et SELECT dans Supabase.');return}
    location.reload();
  };
  const del=document.createElement('button');del.type='button';del.className='secondary';del.textContent='🗑 Supprimer';
  del.onclick=async()=>{
    if(!confirm('Supprimer définitivement cette photo ? Cette action est irréversible.'))return;
    const {error}=await client.storage.from(bucket).remove([path]);
    if(error){alert('Suppression impossible : '+error.message+'\nVérifie la règle DELETE dans Supabase.');return}
    card.remove();
  };
  controls.append(rename,del);card.append(controls);
}

async function allPhotoPaths(uid){const results=[],errors=[];async function walk(prefix,depth){if(depth>5)return;let offset=0;do{const {data,error}=await client.storage.from(bucket).list(prefix,{limit:100,offset,sortBy:{column:'name',order:'asc'}});if(error){errors.push(error.message);return}const arr=data||[];for(const item of arr){if(!item.name||item.name.startsWith('.'))continue;const path=`${prefix}/${item.name}`;if(item.id){results.push(path)}else{await walk(path,depth+1)}}offset+=arr.length;if(arr.length<100)break}while(offset<2000)}await walk(uid,0);return {results,errors}}

/* Lecture HTML isolée : aucun accès à l'origine, cookies, localStorage ou DOM du site parent. */
function aeIsHtmlResource(path){return /\.html?\.txt$/i.test(path)}
async function aeOpenHtmlResource(path){
 const {data,error}=await client.storage.from(resourcesBucket).createSignedUrl(path,300);
 if(error)throw Error(error.message);
 const response=await fetch(data.signedUrl,{credentials:'omit'});
 if(!response.ok)throw Error('Téléchargement impossible ('+response.status+').');
 const html=await response.text();
 if(html.length>11*1024*1024)throw Error('Document trop volumineux.');
 const old=document.getElementById('aeHtmlReader');if(old)old.remove();
 const overlay=document.createElement('div');overlay.id='aeHtmlReader';
 overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(10,25,49,.78);display:flex;flex-direction:column;padding:12px;gap:9px';
 const bar=document.createElement('div');bar.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:white;padding:9px 12px;border-radius:10px';
 const name=document.createElement('strong');name.style.cssText='flex:1;word-break:break-word';name.textContent=readableFilename(path).replace(/\.html?\.txt$/i,'.html');
 const download=document.createElement('button');download.className='secondary';download.textContent='⬇ Télécharger';
 download.onclick=()=>{const blob=new Blob([html],{type:'text/html;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=readableFilename(path).replace(/\.html?\.txt$/i,'.html').replace(/ /g,'_');a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)};
 const close=document.createElement('button');close.className='primary';close.textContent='✕ Fermer';close.onclick=()=>overlay.remove();
 bar.append(name,download,close);
 const frame=document.createElement('iframe');frame.title='Document HTML isolé';
 // Autorise la boîte de dialogue d'impression dans le lecteur isolé, sans accès à l'origine du site.
 frame.setAttribute('sandbox','allow-scripts allow-modals');
 frame.setAttribute('referrerpolicy','no-referrer');
 frame.style.cssText='flex:1;min-height:0;width:100%;background:white;border:0;border-radius:10px';
 // srcdoc évite de naviguer vers le HTML du stockage Supabase dans le contexte du site.
 frame.srcdoc=html;
 overlay.append(bar,frame);document.body.append(overlay);
}
function aeBindHtmlLink(a,path){
 if(!aeIsHtmlResource(path))return;
 a.href='#';a.removeAttribute('target');a.removeAttribute('rel');
 a.onclick=async e=>{e.preventDefault();try{await aeOpenHtmlResource(path)}catch(err){alert('Lecture HTML impossible : '+err.message+'\\nVérifie les règles Supabase et le téléchargement du fichier.')}};
}

async function refreshParentChapters(preferred=''){
 const person=document.getElementById('resStudent')?.value,mat=document.getElementById('resSubject')?.value;
 const picker=document.getElementById('resExistingChapter'),overview=document.getElementById('resChapterOverview'),list=document.getElementById('resList');
 if(!picker)return;
 picker.innerHTML='<option value="">Chargement…</option>';overview.replaceChildren();list.replaceChildren();
 const uid=parentUIDs[person];
 if(!uid){picker.innerHTML='<option value="">UID non enregistré</option>';resourceMessage('Saisis les UID dans « Consultation Parent », puis clique sur « Consulter les deux dossiers ».');return}
 const {paths,errors}=await listResourcesRecursive(`${uid}/${slug(mat)}`);
 if(person!==document.getElementById('resStudent')?.value||mat!==document.getElementById('resSubject')?.value)return;
 if(errors.length){picker.innerHTML='<option value="">Impossible de lire les chapitres</option>';resourceMessage(errors.join('; '));return}
 const chapters=new Map();

function cleanNewFilename(input,oldPath){

 if(extension && name.toLowerCase().endsWith(extension.toLowerCase()))name=name.slice(0,-extension.length);

 app.innerHTML=`<button class="back" id="chatReturn">← Mes conversations</button><div class="panel"><h2>💬 ${safe(title)}</h2><div id="chatNotice" class="status" role="status"></div><div id="chatMessages" class="chat-messages">Chargement…</div><label for="chatText">Ton message</label><textarea id="chatText" placeholder="Écrire un message…" rows="2" maxlength="4000"></textarea><label for="chatFile">Document ou photo (facultatif, 10 Mo maximum)</label><input id="chatFile" type="file" accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.webp"><div class="actions"><button class="primary" id="chatSend">Envoyer</button><button class="secondary" id="chatRefresh">Actualiser</button></div></div>`;
 document.getElementById('chatReturn').onclick=chatBack;document.getElementById('chatRefresh').onclick=()=>loadChat(id);
 document.getElementById('chatSend').onclick=()=>sendChat(id);
 await loadChat(id);
}
async function loadChat(id){
 const el=document.getElementById('chatMessages');if(!el||activeChat!==id)return;
 const {data,error}=await client.from('ae_messages').select('id,sender_id,body,attachment_path,attachment_name,created_at').eq('conversation_id',id).order('created_at',{ascending:true}).limit(200);
 if(!el.isConnected||activeChat!==id)return;
 if(error){chatNotice('Lecture impossible : '+error.message);return}
 el.innerHTML=(data||[]).map(m=>`<div class="chat-line ${m.sender_id===currentId()?'mine':''}"><div class="chat-bubble"><span class="tiny muted">${m.sender_id===currentId()?'Moi':'Famille'} · ${safe(new Date(m.created_at).toLocaleString('fr-FR'))}</span>${m.body?`<p>${safe(m.body)}</p>`:''}${m.attachment_path?`<button class="doc" data-file="${safe(m.attachment_path)}">📎 ${safe(m.attachment_name||'Document')}</button>`:''}${m.sender_id===currentId()?`<button class="chat-delete" data-message="${safe(m.id)}" title="Supprimer mon message">Supprimer</button>`:''}</div></div>`).join('')||'<p class="muted">Aucun message pour le moment.</p>';
 el.querySelectorAll('[data-file]').forEach(b=>b.onclick=async()=>{const {data,error}=await client.storage.from(chatBucket).createSignedUrl(b.dataset.file,90);if(error)return chatNotice('Document inaccessible : '+error.message);window.open(data.signedUrl,'_blank','noopener,noreferrer')});
 el.querySelectorAll('[data-message]').forEach(b=>b.onclick=async()=>{if(!confirm('Supprimer définitivement ce message ?'))return;const {error}=await client.from('ae_messages').delete().eq('id',b.dataset.message);if(error)return chatNotice(error.message);await loadChat(id)});
 el.scrollTop=el.scrollHeight;
 await markChatRead(id);
}
async function sendChat(id){
 if(activeChat!==id)return;
 const text=document.getElementById('chatText').value.trim(),file=document.getElementById('chatFile').files[0],btn=document.getElementById('chatSend');
 if(!text&&!file)return chatNotice('Écris un message ou choisis un document.');
 if(file&&(file.size>fileLimit||!['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','text/plain','image/jpeg','image/png','image/webp'].includes(file.type)))return chatNotice('Fichier non pris en charge (PDF, Word, TXT, JPG, PNG, WebP ; 10 Mo maximum).');
 btn.disabled=true;chatNotice('Envoi en cours…');let path=null;
 try{
  if(file){const ext=(file.name.split('.').pop()||'dat').toLowerCase();path=`${id}/${currentId()}/${crypto.randomUUID()}.${ext}`;const up=await client.storage.from(chatBucket).upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error}
  const {error}=await client.from('ae_messages').insert({conversation_id:id,sender_id:currentId(),body:text,attachment_path:path,attachment_name:file?.name||null});if(error)throw error;
  document.getElementById('chatText').value='';document.getElementById('chatFile').value='';chatNotice('Message envoyé.');await loadChat(id);
 }catch(e){if(path)await client.storage.from(chatBucket).remove([path]);chatNotice('Envoi impossible : '+e.message)}finally{btn.disabled=false}
}


// Vidéos : liens YouTube contrôlés et fichiers MP4 dans le dossier du chapitre.
function youtubeId(link){try{const u=new URL(link);let id='';if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(u.hostname)){id=u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed)\/([^/]+)/)?.[1]||''}else if(u.hostname==='youtu.be'||u.hostname==='www.youtu.be'){id=u.pathname.slice(1).split('/')[0]}return /^[a-zA-Z0-9_-]{11}$/.test(id)?id:null}catch{return null}}
function videoPlatform(url=''){try{const host=new URL(url).hostname.replace(/^www\./,'').toLowerCase();if(host.includes('youtube')||host==='youtu.be')return 'youtube';if(host.includes('facebook'))return 'facebook';return 'video'}catch{return 'video'}}
function videoThumbPlaceholder(title,platform){
 const label=platform==='facebook'?'Reel Facebook':platform==='youtube'?'YouTube':'Vidéo en ligne';
 const emoji=platform==='facebook'?'📘':platform==='youtube'?'▶️':'🎬';
 const colors=platform==='facebook'?['#1877f2','#7db3ff']:platform==='youtube'?['#ff3131','#ff8a65']:['#6b7cff','#9c89ff'];
 const esc=(title||'Vidéo').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="${colors[0]}" offset="0"/><stop stop-color="${colors[1]}" offset="1"/></linearGradient></defs><rect width="480" height="270" rx="24" fill="url(#g)"/><circle cx="82" cy="80" r="36" fill="rgba(255,255,255,.22)"/><text x="82" y="93" text-anchor="middle" font-size="34">${emoji}</text><text x="38" y="154" font-size="18" fill="white" opacity=".9">${label}</text><text x="38" y="188" font-size="30" fill="white" font-weight="700">${esc.slice(0,28)}</text><text x="38" y="216" font-size="22" fill="white" opacity=".95">${esc.slice(28,58)}</text></svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function createVideoLinkCard(record){
 const platform=videoPlatform(record.url||'');
 const card=document.createElement('article');card.className='video-link-card';
 const img=document.createElement('img');img.className='video-thumb';img.alt='Miniature : '+(record.title||'Vidéo');
 const ytId=platform==='youtube'?youtubeId(record.url||''):null;
 img.src=ytId?`https://img.youtube.com/vi/${ytId}/hqdefault.jpg`:videoThumbPlaceholder(record.title||'Vidéo',platform);
 img.loading='lazy';
 const body=document.createElement('div');body.className='video-link-body';
 const badge=document.createElement('div');badge.className='video-badge';badge.textContent=platform==='facebook'?'📘 Reel Facebook':platform==='youtube'?'▶️ YouTube':'🎬 Vidéo en ligne';
 const title=document.createElement('strong');title.textContent=record.title||'Vidéo en ligne';
 const open=document.createElement('a');open.className='primary small';open.href=record.url;open.target='_blank';open.rel='noopener noreferrer';open.textContent='▶️ Regarder';
 body.append(badge,title,open);card.append(img,body);return card;
}

 }

// V13 : format QCM transportable, dépôt volontaire dans le bucket pédagogique existant.
let pendingQcm=null;
function qcmStatus(s){const el=document.getElementById('qcmParentStatus');if(el)el.textContent=s}
function validateQcm(v){
 if(!v||typeof v!=='object'||Array.isArray(v)||typeof v.title!=='string'||v.title.trim().length<3||v.title.length>150||!Array.isArray(v.questions)||v.questions.length<1||v.questions.length>30)throw Error('Format incorrect : titre et 1 à 30 questions obligatoires.');
 v.questions.forEach((q,i)=>{if(!q||typeof q.question!=='string'||!q.question.trim()||q.question.length>800||!Array.isArray(q.options)||q.options.length!==4||q.options.some(s=>typeof s!=='string'||!s.trim()||s.length>350)||!Number.isInteger(q.correct)||q.correct<0||q.correct>3||typeof q.explanation!=='string'||q.explanation.length>1000)throw Error('Question '+(i+1)+' invalide : 4 réponses, un index correct (0 à 3) et une explication sont nécessaires.')});
 return {title:v.title.trim(),questions:v.questions.map(q=>({question:q.question,options:q.options,correct:q.correct,explanation:q.explanation}))};
}
function bindParentQcm(){
 const picker=document.getElementById('qcmImport'),preview=document.getElementById('qcmPreview'),publish=document.getElementById('qcmPublish');if(!picker)return;
 picker.onchange=()=>{pendingQcm=null;publish.disabled=true;document.getElementById('qcmPreviewArea').replaceChildren();qcmStatus('Fichier sélectionné. Clique sur Prévisualiser.')};
 preview.onclick=async()=>{
  pendingQcm=null;publish.disabled=true;const f=picker.files?.[0];if(!f)return qcmStatus('Choisis d’abord un fichier JSON.');if(f.size>200000)return qcmStatus('Fichier trop volumineux (200 Ko maximum).');
  try{pendingQcm=validateQcm(JSON.parse(await f.text()));const area=document.getElementById('qcmPreviewArea');area.replaceChildren();const title=document.createElement('h3');title.textContent=pendingQcm.title;area.append(title);
  pendingQcm.questions.forEach((q,i)=>{const p=document.createElement('p');p.textContent=(i+1)+'. '+q.question;area.append(p);const ul=document.createElement('ol');q.options.forEach((o,j)=>{const li=document.createElement('li');li.textContent=o+(j===q.correct?' ✓':'');ul.append(li)});area.append(ul);const note=document.createElement('p');note.className='hint';note.textContent='Explication : '+q.explanation;area.append(note)});
  publish.disabled=false;qcmStatus(pendingQcm.questions.length+' questions vérifiées. Rien n’est encore publié.');
  }catch(e){qcmStatus('Fichier refusé : '+e.message)}
 };
 publish.onclick=async()=>{
  if(!pendingQcm||!isParent())return qcmStatus('Prévisualisation et connexion Parent nécessaires.');const {n,mat,chapter,uid}=resourceInputs();if(!uid||!chapter)return qcmStatus('Choisis un élève et un chapitre ; vérifie les UID dans Consultation Parent.');
  if(!confirm('Publier « '+pendingQcm.title+' » pour '+n+' → '+mat+' → '+chapter+' ?'))return;
  publish.disabled=true;qcmStatus('Publication en cours…');
  const path=resourcePath(uid,mat,chapter,'exercices')+'/qcm-'+Date.now()+'-'+crypto.randomUUID().slice(0,8)+'.json';
  try{const f=new Blob([JSON.stringify(pendingQcm,null,2)],{type:'application/json'});const {error}=await client.storage.from(resourcesBucket).upload(path,f,{contentType:'application/json',upsert:false});if(error)throw error;await aenNotify(uid,pendingQcm.title,mat,chapter,'exercices',resourcesBucket,path);qcmStatus('QCM publié pour '+n+'. Vérifie sa présence depuis le compte élève.');pendingQcm=null;picker.value='';await refreshParentChapters(chapter)}catch(e){qcmStatus('Publication impossible : '+e.message);publish.disabled=false}
 };
}

function openStudentQcm(quiz){
 const backup={subject,lesson,cloudChapter};let answers={};let submitted=false;
 function paint(){
 app.replaceChildren();const back=document.createElement('button');back.className='back';back.textContent='← Retour au chapitre';back.onclick=()=>{subject=backup.subject;lesson=backup.lesson;cloudChapter=backup.cloudChapter;render()};app.append(back);
 const box=document.createElement('div');box.className='panel';const title=document.createElement('h2');title.textContent='🧩 '+quiz.title;box.append(title);
 const note=document.createElement('p');note.className='hint';note.textContent='Choisis une réponse à chaque question. Les corrections apparaîtront à la fin.';box.append(note);
 quiz.questions.forEach((q,i)=>{const block=document.createElement('div');block.className='boxline';const h=document.createElement('h3');h.textContent='Question '+(i+1)+' — '+q.question;block.append(h);q.options.forEach((o,j)=>{const lbl=document.createElement('label');lbl.className='check';const radio=document.createElement('input');radio.type='radio';radio.name='question-'+i;radio.checked=answers[i]===j;radio.disabled=submitted;radio.onchange=()=>{answers[i]=j};lbl.append(radio,document.createTextNode(o));block.append(lbl)});if(submitted){const p=document.createElement('p');p.className='note';p.textContent=(answers[i]===q.correct?'✓ Correct. ':'Réponse : '+q.options[q.correct]+'. ')+q.explanation;block.append(p)}box.append(block)});
 if(submitted){const score=quiz.questions.filter((q,i)=>answers[i]===q.correct).length;const result=document.createElement('h2');result.textContent='Résultat : '+score+' / '+quiz.questions.length;box.append(result);const retry=document.createElement('button');retry.className='secondary';retry.textContent='Recommencer';retry.onclick=()=>{answers={};submitted=false;paint()};box.append(retry)}else{const validate=document.createElement('button');validate.className='primary';validate.textContent='Valider et voir les corrections';validate.onclick=()=>{if(Object.keys(answers).length!==quiz.questions.length)return alert('Réponds à toutes les questions avant de valider.');submitted=true;paint()};box.append(validate)}app.append(box);
 }paint();
}

// Boîte de dépôt familiale : chaque élément est conservé séparément dans Supabase.
const inboxFolder='boite-papa';
function inboxPrefix(uid){return uid+'/'+inboxFolder}
function inboxName(path){return path.split('/').pop().replace(/^\d+-[a-f0-9]{8}-/,'').replace(/_/g,' ')}
function inboxMsg(id,value){const el=document.getElementById(id);if(el)el.textContent=value}
function inboxIsLink(path){return path.endsWith('.lien.txt')}
function studentInboxPanel(){
 if(!authenticated()||isParent())return;
 const panel=document.createElement('section');panel.className='ae-inline-inbox';
 panel.innerHTML='<h2>📤 Envoyer à Papa</h2><p class="hint">Envoie plusieurs fichiers différents, ou colle un lien Internet. Pas besoin de titre ni de matière.</p><label for="inboxFiles">PDF, Word, photos ou vidéos MP4</label><input type="file" id="inboxFiles" multiple accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.webp,.mp4,application/pdf,video/mp4,image/*"><label for="inboxLink">Lien Internet (facultatif)</label><input type="url" id="inboxLink" placeholder="https://..."><div class="actions"><button class="primary" type="button" id="inboxSend">📤 Envoyer à Papa</button><button class="secondary" type="button" id="inboxReload">Actualiser mes envois</button></div><div id="inboxStatus" class="status" role="status">Tu peux envoyer plusieurs éléments sans les classer.</div><h3>Mes envois</h3><div id="inboxMine"></div>';
 const slot=document.getElementById('inboxSlot');if(slot)slot.appendChild(panel);else app.insertBefore(panel,app.firstChild);
 const intro=panel.querySelector('p.hint');if(intro)intro.textContent='PDF, photos, vidéos, liens Internet…';
 const toggle=document.createElement('button');toggle.type='button';toggle.className='primary ae-inbox-toggle';toggle.textContent='＋ Ajouter des documents';
 const form=document.createElement('div');form.className='ae-inbox-details hidden';
 while(intro.nextSibling)form.appendChild(intro.nextSibling);
 intro.after(toggle,form);toggle.onclick=()=>{form.classList.toggle('hidden');toggle.textContent=form.classList.contains('hidden')?'＋ Ajouter des documents':'Fermer les envois'};
 document.getElementById('inboxSend').onclick=sendInboxItems;
 document.getElementById('inboxReload').onclick=()=>loadInboxStudent();
 loadInboxStudent();
}
async function inboxItems(uid){
 let items=[],offset=0;
 while(offset<2000){
  const {data,error}=await client.storage.from(bucket).list(inboxPrefix(uid),{limit:100,offset,sortBy:{column:'name',order:'desc'}});
  if(error)throw error;
  const batch=(data||[]).filter(item=>item.id);
  items.push(...batch.map(item=>({...item,path:inboxPrefix(uid)+'/'+item.name})));
  if((data||[]).length<100)break;
  offset+=(data||[]).length;
 }
 return items;
}
async function sendInboxItems(){
 const button=document.getElementById('inboxSend'),files=[...(document.getElementById('inboxFiles')?.files||[])],raw=document.getElementById('inboxLink')?.value.trim()||'';
 if(!authenticated()||isParent())return inboxMsg('inboxStatus','Connecte-toi avec un compte élève.');
 if(!files.length&&!raw)return inboxMsg('inboxStatus','Choisis un fichier ou colle un lien.');
 let url='';if(raw){try{const u=new URL(raw);if(!['https:','http:'].includes(u.protocol))throw Error();url=u.href}catch{return inboxMsg('inboxStatus','Lien incorrect : commence par https://')}}
 for(const f of files){if(!/\.(pdf|doc|docx|txt|png|jpe?g|webp|mp4)$/i.test(f.name))return inboxMsg('inboxStatus','Format non accepté : '+f.name);if(f.size>40*1024*1024)return inboxMsg('inboxStatus','Fichier trop volumineux (40 Mo maximum par fichier) : '+f.name)}
 button.disabled=true;let sent=0;
 try{
  const items=[...files];if(url)items.push(new File([url],(new URL(url)).hostname+'.lien.txt',{type:'text/plain'}));
  for(const f of items){
   inboxMsg('inboxStatus',`Envoi ${sent+1}/${items.length}…`);
   const file=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-105),path=inboxPrefix(currentId())+'/'+Date.now()+'-'+crypto.randomUUID().slice(0,8)+'-'+file;
   const {error}=await client.storage.from(bucket).upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});
   if(error)throw Error(error.message+' (vérifier les droits INSERT et les formats MIME de « documents eleves »)');sent++;
  }
  document.getElementById('inboxFiles').value='';document.getElementById('inboxLink').value='';
  inboxMsg('inboxStatus',sent+' élément(s) envoyé(s).');await loadInboxStudent();
 }catch(e){inboxMsg('inboxStatus',sent+' envoyé(s). Erreur : '+e.message)}finally{button.disabled=false}
}
async function inboxOpen(path){
 const {data,error}=await client.storage.from(bucket).createSignedUrl(path,300);if(error)throw error;
 if(inboxIsLink(path)){const r=await fetch(data.signedUrl);if(!r.ok)throw Error('Lien illisible');const href=(await r.text()).trim();const u=new URL(href);if(!['https:','http:'].includes(u.protocol))throw Error('Lien non sécurisé');window.open(u.href,'_blank','noopener,noreferrer')}
 else window.open(data.signedUrl,'_blank','noopener,noreferrer');
}
async function inboxRemove(path,status,refresh){
 if(!confirm('Supprimer cet envoi ? Confirme uniquement si Papa a déjà récupéré ce document.'))return;
 try{
  const {error}=await client.storage.from(bucket).remove([path]);if(error)throw error;
  const still=await inboxItems(path.split('/')[0]);
  if(still.some(f=>f.path===path))throw Error('Suppression non confirmée : fichier toujours présent sur Supabase.');
  inboxMsg(status,'Document supprimé.');await refresh();
 }catch(e){inboxMsg(status,'Impossible de supprimer : '+e.message+' (vérifier la politique DELETE du stockage).')}
}
async function loadInboxStudent(){
 const dest=document.getElementById('inboxMine');if(!dest)return;dest.textContent='Chargement…';
 try{const files=await inboxItems(currentId());dest.replaceChildren();if(!files.length){dest.textContent='Aucun envoi pour le moment.';return}
 for(const f of files){const row=document.createElement('div');row.className='resource-entry';const label=document.createElement('span');label.textContent=(inboxIsLink(f.path)?'🔗 ':'📎 ')+inboxName(f.path);const buttons=document.createElement('div');buttons.className='resource-buttons';const open=document.createElement('button');open.className='secondary';open.textContent='Ouvrir';open.onclick=()=>inboxOpen(f.path).catch(e=>inboxMsg('inboxStatus',e.message));const del=document.createElement('button');del.className='danger';del.textContent='Supprimer';del.onclick=()=>inboxRemove(f.path,'inboxStatus',loadInboxStudent);buttons.append(open,del);row.append(label,buttons);dest.append(row)}
 }catch(e){dest.textContent='Impossible de charger : '+e.message}
}

async function aeReadSubjects(uid){
 const {data,error}=await client.from(aeSyncRows).select('nom').eq('eleve_id',uid);

async function aePublishSubjects(who){
 if(!client||!isParent())throw new Error('Connexion Parent nécessaire.');
 const uid=parentUIDs[who];
 if(!/^[\da-f]{8}(-[\da-f]{4}){3}-[\da-f]{12}$/i.test(uid||''))throw new Error('UID de '+who+' manquant : renseigne-le dans Consultation Parent puis clique sur « Consulter les deux dossiers ».');
 const d=load(who);
 const desired=[...new Set(d.subjects.filter(x=>subjects.includes(x)&&!(d.archivedSubjects||[]).includes(x)))];
 if(!desired.length)throw new Error('Aucune matière active pour '+who+'. Import refusé pour éviter une suppression accidentelle.');
 const existing=await aeReadSubjects(uid);
 const missing=desired.filter(x=>!existing.includes(x));
 if(missing.length){const {error}=await client.from(aeSyncRows).insert(missing.map(nom=>({eleve_id:uid,nom})));if(error)throw error;}
 const extra=existing.filter(x=>!desired.includes(x));
 for(const nom of extra){const {error}=await client.from(aeSyncRows).delete().eq('eleve_id',uid).eq('nom',nom);if(error)throw error;}
 return desired.length;
}

}

 const {paths,errors}=await listResourcesRecursive(`${uid}/${slug(mat)}`);
 if(errors.length)throw Error(errors.join('; '));
 const chapters=new Map();for(const path of paths){const p=path.split('/');if(p.length>=5&&!chapters.has(p[2]))chapters.set(p[2],p[2].replace(/-/g,' '));}

}

 const libAdd=document.getElementById('aeLibAdd');if(libAdd){const sel=document.createElement('div');sel.innerHTML='<label>Dossier de destination</label>'+ae15FolderSelect();libAdd.before(sel)}
}
function ae15RenderFolders(){const area=document.getElementById('ae15FolderButtons');if(!area)return;area.replaceChildren();for(const folder of [{id:'',nom:'Toutes les ressources'},...ae15ParentFolders]){const b=document.createElement('button');b.type='button';b.className=ae15SelectedFolder===folder.id?'primary':'secondary';b.textContent='📁 '+folder.nom;b.onclick=()=>{ae15SelectedFolder=folder.id;ae15RenderFolders();aeLibRender()};area.append(b);if(folder.id){const r=document.createElement('button');r.textContent='✏️';r.className='secondary';r.title='Renommer '+folder.nom;r.onclick=()=>ae15RenameFolder(folder);area.append(r);const del=document.createElement('button');del.textContent='🗑';del.className='secondary';del.title='Supprimer le dossier sans effacer les ressources';del.onclick=()=>ae15DeleteFolder(folder);area.append(del)}}}
async function ae15DeleteFolder(folder){if(!confirm('Supprimer le dossier « '+folder.nom+' » ? Ses ressources resteront dans la bibliothèque, sans dossier.'))return;const {error}=await client.from('ae_dossiers_parent').delete().eq('id',folder.id).eq('parent_id',currentId());if(error)return ae15ShowError('ae15FolderMsg',error);if(ae15SelectedFolder===folder.id)ae15SelectedFolder='';await ae15LoadFolders();ae15RenderFolders();await aeLibLoad(false)}
async function ae15RenameFolder(folder){const name=prompt('Nouveau nom du dossier',folder.nom)?.trim();if(!name||name===folder.nom)return;const {error}=await client.from('ae_dossiers_parent').update({nom:name}).eq('id',folder.id).eq('parent_id',currentId());if(error)return ae15ShowError('ae15FolderMsg',error);await ae15LoadFolders();ae15RenderFolders()}
const ae15OldLibRender=aeLibRender;
aeLibRender=function(){ae15OldLibRender();const root=document.getElementById('aeLibList');if(!root)return;
 const q=(document.getElementById('aeLibSearch')?.value||'').toLocaleLowerCase(),f=document.getElementById('aeLibFilter')?.value||'';
 const matching=aeLibItems.filter(x=>(!f||x.matiere===f)&&[x.title,x.commentaire,x.matiere].join(' ').toLocaleLowerCase().includes(q));
 for(const [index,card] of [...root.querySelectorAll('.ae-lib-card')].entries()){
  const x=matching[index];if(!x)continue;card.dataset.folder=x.dossier_id||'';
  const controls=card.querySelector('.ae-lib-controls');if(!controls)continue;
  const select=document.createElement('select');select.setAttribute('aria-label','Dossier de la ressource');for(const f of [{id:'',nom:'Sans dossier'},...ae15ParentFolders])select.add(new Option(f.nom,f.id));select.value=x.dossier_id||'';
  select.onchange=async()=>{const {error}=await client.from('ae_bibliotheque').update({dossier_id:select.value||null}).eq('id',x.id).eq('parent_id',currentId());if(error)return aeLibMsg('Déplacement impossible : '+ae15Error(error));x.dossier_id=select.value||null;aeLibRender();};
  const send=document.createElement('button');send.className='primary';send.textContent='📨 Envoyer aux filles';send.onclick=()=>ae15SendFromLibrary(x);
  controls.prepend(select,send)
 }
 if(ae15SelectedFolder)for(const card of root.querySelectorAll('.ae-lib-card'))if(card.dataset.folder!==ae15SelectedFolder)card.remove();
 // Les ressources sont regroupées visuellement par matière et chapitre.
 const cards=[...root.querySelectorAll('.ae-lib-card')];if(cards.length){const groups=new Map();for(const card of cards){const title=card.querySelector('h3')?.textContent||'';const x=matching.find(v=>title===(v.type==='lien'?'🔗 ':'📎 ')+v.title && (v.dossier_id||'')===(card.dataset.folder||''));const label=x?x.matiere+' → '+(x.chapitre||'Sans chapitre'):'Autres ressources';if(!groups.has(label))groups.set(label,[]);groups.get(label).push(card)}for(const [label,arr] of [...groups].sort(([a],[b])=>a.localeCompare(b,'fr'))){const h=document.createElement('h3');h.className='ae-lab-chapter-heading';h.textContent='📁 '+label;h.style.cssText='grid-column:1/-1;margin:18px 0 5px;color:#254570;font-size:17px';root.append(h,...arr)}}
};
async function ae15SendFromLibrary(x){if(!isParent())return;
 const choice=prompt('Envoyer à qui ? Saisis Alexane, Clémence ou Les deux :','Alexane');if(choice===null)return;
 const v=choice.trim().toLocaleLowerCase('fr');const names=v==='les deux'?['Alexane','Clémence']:v==='alexane'?['Alexane']:v==='clémence'||v==='clemence'?['Clémence']:null;
 if(!names)return aeLibMsg('Destinataire invalide. Écris Alexane, Clémence ou Les deux.');
 const targets=names.map(n=>parentUIDs[n]);if(targets.some(uid=>!/^[a-f0-9-]{36}$/i.test(uid||'')))return aeLibMsg('UID élève manquant : renseigne les UID dans Gestion des ressources.');
 const msg=prompt('Petit message pour les filles (facultatif) :',x.commentaire||'');if(msg===null)return;
 if(!confirm('Envoyer « '+x.title+' » à '+names.join(' et ')+' ?'))return;
 aeLibMsg('Envoi en cours…');let filePath='';try{
  if(x.type==='fichier'){
   const {data,error}=await client.storage.from(aeLibBucket).download(x.fichier);if(error)throw error;
   const fileName=x.fichier.split('/').pop().replace(/[^a-zA-Z0-9._-]/g,'_');filePath=`${currentId()}/${crypto.randomUUID()}-${fileName}`;
   const up=await client.storage.from(ae15Bucket).upload(filePath,data,{contentType:data.type||'application/octet-stream'});if(up.error)throw up.error;
  }
  const rows=targets.map(uid=>({parent_id:currentId(),eleve_id:uid,expediteur_id:currentId(),titre:x.title,commentaire:msg||'',type:x.type==='lien'?'lien':'fichier',lien:x.type==='lien'?x.lien:null,fichier:x.type==='fichier'?filePath:null,nom_fichier:x.type==='fichier'?(x.fichier.split('/').pop().replace(/\.txt$/,'')||'document'):null,statut:'recu'}));
  const {error}=await client.from('ae_partages').insert(rows);if(error)throw error;for(const uid of targets)await aenNotify(uid,x.title,'','','partage',filePath?ae15Bucket:'',filePath||'',x.type==='lien'?x.lien:'');aeLibMsg('✅ Ressource envoyée à '+names.join(' et ')+'. Elle reste dans ta bibliothèque.');
 }catch(e){if(filePath)await client.storage.from(ae15Bucket).remove([filePath]);aeLibMsg('Erreur : '+ae15Error(e))}
}
const ae15OldLibLoad=aeLibLoad;
aeLibLoad=async function(announce=true){if(!isParent())return;if(announce)aeLibMsg('Synchronisation…');try{let all=[],from=0;while(true){const {data,error}=await client.from('ae_bibliotheque').select('id,created_at,parent_id,titre,matiere,type,lien,commentaire,fichier,dossier_id').eq('parent_id',currentId()).order('created_at',{ascending:false}).range(from,from+499);if(error)throw error;all.push(...data);if(data.length<500)break;from+=500}aeLibItems=all.map(aeLabItem);aeLibRender();aeLibMsg(`${all.length} ressource(s) synchronisée(s).`)}catch(e){ae15ShowError('aeLibStatus',e)}};
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-ae15-nav]');if(!b)return;const t=b.dataset.ae15Nav;if(t==='logout'){logout();return}if(t==='notifications'){aenOpen();return}ae15StudentPage=t;subject=null;lesson=null;cloudChapter=null;render()});
const ae15OldGoHome=goHome;goHome=function(){if(!isParent())ae15StudentPage='home';ae15OldGoHome()};


// V15.1 — Notifications : disponibles seulement lorsqu'une ressource est publiée/envoyée.
// Ne remplace aucun système existant. En cas d'erreur RLS, la publication reste conservée.
let aenLatest=[],aenAccount='',aenBusy=false,aenWarnings=[];
async function aenNotify(recipient,title,matiere='',chapitre='',categorie='',resource_bucket='',resource_path='',resource_url=''){
 if(!client||!isParent()||!recipient)return;
 const row={recipient_id:recipient,parent_id:currentId(),titre:String(title||'Nouvelle ressource').slice(0,200),matiere:matiere||'Ressource',chapitre:chapitre||'Accueil',categorie:categorie||'partage',resource_bucket:resource_bucket||null,resource_path:resource_path||null,resource_url:resource_url||null};
 const {error}=await client.from('ae_notifications').insert(row);
 if(error){console.warn('Alerte non créée :',error.message);aenWarnings.push(error.message);const el=document.getElementById('aenWarning');if(el)el.textContent='⚠️ La ressource a été publiée, mais son alerte n’a pas pu être créée : '+error.message}
}
async function aenRefresh(){
 const id=currentId();if(!id||isParent()||!client)return;
 if(aenBusy)return;aenBusy=true;
 try{const {data,error}=await client.from('ae_notifications').select('id,titre,matiere,chapitre,categorie,resource_bucket,resource_path,resource_url,created_at').eq('recipient_id',id).order('created_at',{ascending:false}).limit(100);
 if(error)throw error;if(id!==currentId())return;aenLatest=data||[];aenAccount=id;
 document.querySelectorAll('#aenNavCount').forEach(b=>{b.textContent=aenLatest.length;b.classList.toggle('hidden',!aenLatest.length)})
 }catch(e){console.warn('Notifications indisponibles :',e.message)}finally{aenBusy=false}
}
function aenOpen(){
 if(!authenticated()||isParent())return;
 document.getElementById('aenOverlay')?.remove();
 const backdrop=document.createElement('div');backdrop.className='aen-overlay';backdrop.id='aenOverlay';
 const box=document.createElement('section');box.className='aen-dialog';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label','Mes nouveautés');
 box.innerHTML='<div class="aen-header"><h2>🔔 Mes nouveautés</h2><button class="secondary" id="aenClose">✕ Fermer</button></div><p id="aenInfo" class="hint">Chargement…</p><div id="aenList"></div>';
 backdrop.append(box);document.body.append(backdrop);
 const close=()=>backdrop.remove();box.querySelector('#aenClose').onclick=close;backdrop.onclick=e=>{if(e.target===backdrop)close()};
 aenRefresh().then(()=>{if(!box.isConnected)return;const list=box.querySelector('#aenList');list.replaceChildren();box.querySelector('#aenInfo').textContent=aenLatest.length?aenLatest.length+' nouveauté(s) à consulter':'Aucune nouveauté pour le moment.';
 for(const item of aenLatest){const btn=document.createElement('button');btn.className='aen-row';const t=document.createElement('strong');t.textContent=item.titre;const meta=document.createElement('small');meta.textContent=[item.matiere,item.chapitre].filter(x=>x&&x!=='Accueil'&&x!=='Ressource').join(' → ')||'Envoyé par Papa';btn.append(t,meta);btn.onclick=()=>aenVisit(item,btn);list.append(btn)}});
}
async function aenVisit(item,button){
 if(!client||!authenticated()||isParent())return;
 button.disabled=true;let opened=false;
 try{
  if(item.resource_url){const u=new URL(item.resource_url);if(!['https:','http:'].includes(u.protocol))throw Error('Adresse interdite');const tab=window.open(u.href,'_blank');if(!tab)throw Error('Autorise l’ouverture du lien dans ton navigateur.');tab.opener=null;opened=true}
  else if(item.resource_path&&item.resource_bucket){
   const p=item.resource_path,b=item.resource_bucket;
   if(b===resourcesBucket&&aeIsHtmlResource(p)){await aeOpenHtmlResource(p);opened=true}
   else if(b===resourcesBucket&&/\/qcm-[^/]+\.json$/i.test(p)){const {data,error}=await client.storage.from(b).download(p);if(error)throw error;const quiz=validateQcm(JSON.parse(await data.text()));document.getElementById('aenOverlay')?.remove();openStudentQcm(quiz);opened=true}
   else if(b===resourcesBucket&&/\.(link|youtube)\.json$/i.test(p)){const {data,error}=await client.storage.from(b).download(p);if(error)throw error;const rec=JSON.parse(await data.text());if(!rec.url)throw Error('Lien manquant');const u=new URL(rec.url);if(!['https:','http:'].includes(u.protocol))throw Error('Adresse interdite');const tab=window.open(u.href,'_blank');if(!tab)throw Error('Autorise les fenêtres de ton navigateur.');tab.opener=null;opened=true}
   else{const {data,error}=await client.storage.from(b).createSignedUrl(p,600);if(error)throw error;const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';document.body.append(a);a.click();a.remove();opened=true}
  }else throw Error('Aucun document associé à cette notification.');
  if(opened){const {error}=await client.from('ae_notifications').delete().eq('id',item.id).eq('recipient_id',currentId());if(error)throw Error('Document ouvert, mais suppression de la notification impossible : '+error.message);
   aenLatest=aenLatest.filter(x=>x.id!==item.id);document.querySelectorAll('#aenNavCount').forEach(b=>{b.textContent=aenLatest.length;b.classList.toggle('hidden',!aenLatest.length)});button.remove();const info=document.getElementById('aenInfo');if(info)info.textContent=aenLatest.length?aenLatest.length+' nouveauté(s) à consulter':'Aucune nouveauté pour le moment.';
  }
 }catch(e){alert('Ouverture impossible : '+(e.message||e))}finally{button.disabled=false}
}

init();render();
</script></body></html>
