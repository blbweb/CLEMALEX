function subjectsView(d){
 const materiels=d.subjects.filter(x=>!(d.archivedSubjects||[]).includes(x));
 const brief={'Mathématiques':'Maths','Physique-Chimie':'Physique','Histoire-Géographie':'Histoire-Géo'};
 app.innerHTML=toolbar()+`<div class="pupil-welcome ae-personal-layout">

 <div id="inboxSlot" class="ae-inbox-block"></div></div>
 <section class="ae-discovery panel"><div class="row"><h2>💡 La découverte du jour</h2><span class="tag">Sciences</span></div><p><strong>Pourquoi les astronautes flottent-ils dans l'espace ?</strong></p><button type="button" id="discoveryReveal" class="secondary">Voir la réponse</button><p id="discoveryAnswer" class="hidden">Les astronautes et leur station spatiale sont en chute libre permanente autour de la Terre. La gravité agit toujours : ils semblent flotter parce qu'ils tombent ensemble.</p><p class="hint">Exemple de découverte : la publication par le Parent sera ajoutée dans une prochaine étape.</p></section>

 <div class="cards ae-compact-cards">${materiels.map(mat=>`<button class="card" data-subject="${safe(mat)}" title="${safe(mat)}"><span class="symbol">${icons[mat]||'📁'}</span><h3>${safe(brief[mat]||mat)}</h3></button>`).join('')}</div>

 bindAvatar();

function lessonsView(d){const arr=d.lessons.filter(l=>l.subject===subject&&!((d.archivedLessons||[]).includes(l.id)));app.innerHTML=toolbar()+`<button class="back" data-act="back-subject">← Toutes les matières</button><h2>${icons[subject]||'📁'} ${safe(subject)}</h2>${subjectMobileArea()}<div class="panel"><h2>📚 Mes chapitres</h2><p class="hint">Ouvre un chapitre pour voir ses cours, exercices, corrigés et mémos dans quatre blocs distincts.</p><div id="chapterList">${arr.map(l=>`<button class="chapter-card" data-open="${safe(l.id)}"><strong>📖 ${safe(l.title)}</strong><span>→</span></button>`).join('')||'<p class="muted">Chargement des chapitres enregistrés en ligne…</p>'}</div></div><div class="panel"><h3>📷 Photos de ${safe(subject)}</h3><p class="hint">Seules les photos de cette matière sont affichées ici. Tu peux renommer ou supprimer tes propres photos après confirmation.</p><div id="msg" class="status" aria-live="polite"></div><div id="subjectPhotos" class="photo-grid"></div></div>`;bindSubjectMobile();if(authenticated()&&!isParent())listSubjectPhotos(currentId(),subject,'subjectPhotos');else if(authenticated()&&isParent())document.getElementById('subjectPhotos').textContent='La consultation des photos des filles se fait dans l’espace Parent.';else document.getElementById('subjectPhotos').textContent='Connecte-toi pour consulter tes photos.'}
function subjectMobileArea(){const url=new URL(publicSite);url.searchParams.set('eleve',user);url.searchParams.set('matiere',subject);const link=url.toString();return `<div class="mobile-panel"><h3>📱 Envoyer depuis mon téléphone</h3><p>La photo sera enregistrée dans <b>${safe(user)} → ${safe(subject)}</b>, pas dans une autre matière.</p><div class="actions"><button class="secondary" id="showQR">Afficher le QR code</button><a class="secondary" href="${safe(link)}" target="_blank" rel="noopener noreferrer">Ouvrir la version mobile ↗</a></div><div class="qrwrap hidden" id="qrArea"><div id="qrCanvas" aria-label="QR code d’accès à la matière"></div><div><p class="hint">Scanne ce code avec le téléphone pour ouvrir cette matière.</p><a class="mobile-link" href="${safe(link)}" target="_blank" rel="noopener noreferrer">${safe(link)}</a><p class="hint">Une connexion au compte personnel reste nécessaire.</p></div></div>${authenticated()&&!isParent()?`<label>Prendre une photo ou choisir plusieurs images</label><input id="subjectPictures" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="actions"><button class="primary" id="subjectUpload">Enregistrer dans ${safe(subject)}</button><button class="secondary" id="refreshSubject">Actualiser les photos</button></div>`:'<p class="warning">Connecte-toi avec le compte de l’élève pour envoyer les photos.</p>'}</div>`}
function bindSubjectMobile(){const qr=document.getElementById('showQR');if(qr)qr.onclick=()=>{const box=document.getElementById('qrArea');box.classList.toggle('hidden');if(!box.classList.contains('hidden')){const url=new URL(publicSite);url.searchParams.set('eleve',user);url.searchParams.set('matiere',subject);const el=document.getElementById('qrCanvas');el.innerHTML='';if(window.QRCode)new QRCode(el,{text:url.toString(),width:160,height:160,correctLevel:QRCode.CorrectLevel.M});else el.textContent='QR code indisponible hors connexion. Utilise le lien ci-contre.'}};const up=document.getElementById('subjectUpload');if(up)up.onclick=uploadSubject;const re=document.getElementById('refreshSubject');if(re)re.onclick=()=>listSubjectPhotos(currentId(),subject,'subjectPhotos')}
async function uploadSubject(){const el=document.getElementById('subjectPictures');const files=[...(el?.files||[])];if(!authenticated())return message('Connecte-toi d’abord.');if(isParent())return message('Utilise un compte élève pour ce dépôt.');if(!files.length)return message('Choisis au moins une photo.');for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10*1024*1024)return message('Formats acceptés : JPG, PNG ou WebP, 10 Mo maximum par photo.')}const folder=`${currentId()}/${slug(subject)}/non-classe`;let count=0;message('Envoi en cours…');for(const f of files){const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg';const filename=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,10)}.${ext}`;const {error}=await client.storage.from(bucket).upload(filename,f,{contentType:f.type,upsert:false});if(error)return message(`${count} fichier(s) envoyé(s). Erreur : ${error.message}`);count++}el.value='';message(`${count} photo(s) enregistrée(s) dans ${subject}.`);await listSubjectPhotos(currentId(),subject,'subjectPhotos',false)}
// Gestion des photos : seules les images du dossier personnel (UID) sont modifiables.
function photoOwnerControls(path, card){
  if(!authenticated()||isParent()||!path.startsWith(currentId()+'/'))return;
  const controls=document.createElement('div');controls.className='actions';
  const rename=document.createElement('button');rename.className='secondary';rename.type='button';rename.textContent='✏️ Renommer';
  rename.onclick=async()=>{
    const old=path.split('/').pop(), current=old.replace(/^\d{13}-[a-z0-9]+-/i,'');
    const requested=prompt('Nouveau nom du fichier (garde l’extension) :',current);
    if(requested===null)return;
    const name=requested.trim().replace(/[^a-zA-Z0-9._-]/g,'_');
    if(!name||name==='.'||name==='..'||name.includes('..')||name.length>110){alert('Nom invalide.');return}
    if(name.split('.').pop().toLowerCase()!==old.split('.').pop().toLowerCase()){alert('Conserve le format du fichier (extension).');return}
    const target=path.slice(0,path.lastIndexOf('/')+1)+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+name;
    if(!confirm('Renommer ce document ?'))return;
    const {error}=await client.storage.from(bucket).move(path,target);
    if(error){alert('Impossible de renommer : '+error.message+'\nVérifie les droits UPDATE et SELECT dans Supabase.');return}
    location.reload();
  };
  const del=document.createElement('button');del.type='button';del.className='secondary';del.textContent='🗑 Supprimer';
  del.onclick=async()=>{
    if(!confirm('Supprimer définitivement cette photo ? Cette action est irréversible.'))return;
    const {error}=await client.storage.from(bucket).remove([path]);
    if(error){alert('Suppression impossible : '+error.message+'\nVérifie la règle DELETE dans Supabase.');return}
    card.remove();
  };
  controls.append(rename,del);card.append(controls);
}

async function allPhotoPaths(uid){const results=[],errors=[];async function walk(prefix,depth){if(depth>5)return;let offset=0;do{const {data,error}=await client.storage.from(bucket).list(prefix,{limit:100,offset,sortBy:{column:'name',order:'asc'}});if(error){errors.push(error.message);return}const arr=data||[];for(const item of arr){if(!item.name||item.name.startsWith('.'))continue;const path=`${prefix}/${item.name}`;if(item.id){results.push(path)}else{await walk(path,depth+1)}}offset+=arr.length;if(arr.length<100)break}while(offset<2000)}await walk(uid,0);return {results,errors}}

 const prefix=`${uid}/${slug(mat)}/${selected}`;
 resourceMessage('Vérification du chapitre et de ses fichiers…');

 if(errors.length)return resourceMessage('Impossible de vérifier les fichiers : '+errors.join('; ')+'. Rien ne sera supprimé.');
 const local=load(person),match=local.lessons.filter(l=>l.subject===mat&&slug(l.title)===selected);
 if(!paths.length&&!match.length)return resourceMessage('Chapitre introuvable. Actualise la liste.');

 const confirmation=prompt(`Pour confirmer la suppression définitive, saisis SUPPRIMER :`);
 if(confirmation!=='SUPPRIMER')return resourceMessage('Suppression annulée : confirmation incorrecte.');

   const batch=paths.slice(i,i+50);
   const {data,error}=await client.storage.from(resourcesBucket).remove(batch);
   if(error)return resourceMessage(`Suppression interrompue après ${removed} fichier(s) : ${error.message}. Vérifie les droits DELETE dans Supabase, puis actualise.`);
   if(!Array.isArray(data)||data.length<batch.length)return resourceMessage(`Suppression partielle : ${removed+(data?.length||0)} fichier(s) confirmé(s). Vérifie le stockage avant de recommencer.`);
   removed+=data.length;
  }

async function uploadResource(){if(!isParent())return resourceMessage('Connexion Parent requise.');const {n,mat,chapter,category,uid}=resourceInputs();if(!uid)return resourceMessage(`Renseigne d’abord l’UID de ${n} dans Consultation Parent, puis clique sur « Consulter les deux dossiers ». `);if(!chapter)return resourceMessage('Indique le chapitre.');const files=[...(document.getElementById('resFiles')?.files||[])];const typed=document.getElementById('resText').value.trim();if(!files.length&&!typed)return resourceMessage('Choisis un fichier ou rédige un texte.');if(typed)files.push(new File([typed],`texte-${Date.now()}.txt`,{type:'text/plain'}));for(const f of files){const ext=(f.name.split('.').pop()||'').toLowerCase();if(!['pdf','doc','docx','png','jpg','jpeg','webp','txt'].includes(ext)||f.size>10*1024*1024)return resourceMessage('Formats acceptés : PDF, Word, images ou TXT (10 Mo maximum par document).')}const prefix=resourcePath(uid,mat,chapter,category);resourceMessage(`Envoi vers ${n} → ${mat} → ${chapter} → ${category}…`);let done=0;for(const f of files){const filename=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-110);const object=`${prefix}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${filename}`;const {error}=await client.storage.from(resourcesBucket).upload(object,f,{contentType:f.type||'application/octet-stream',upsert:false});if(error)return resourceMessage(`Échec après ${done} fichier(s) : ${error.message}. Vérifie la configuration du bucket et ses règles.`);done++}document.getElementById('resFiles').value='';document.getElementById('resText').value='';resourceMessage(`${done} document(s) sauvegardé(s) pour ${n} dans ${mat} / ${chapter} / ${category}.`);await refreshParentChapters(chapter)}
async function listResourcesRecursive(prefix,depth=0){if(depth>5)return {paths:[],errors:[]};const paths=[],errors=[];let offset=0;while(true){const {data,error}=await client.storage.from(resourcesBucket).list(prefix,{limit:100,offset});if(error){errors.push(error.message);break}const items=data||[];for(const item of items){if(!item.name||item.name.startsWith('.'))continue;const full=prefix+'/'+item.name;if(item.id)paths.push(full);else{const sub=await listResourcesRecursive(full,depth+1);paths.push(...sub.paths);errors.push(...sub.errors)}}if(items.length<100)break;offset+=100}return {paths,errors}}
function resourceLabel(path){let p=path.split('/');return p.slice(2,5).map(x=>x.replace(/-/g,' ')).join(' → ')}
async function displayResources(paths,container){

function cleanNewFilename(input,oldPath){
 const old=oldPath.split('/').pop();const extension=(old.match(/\.[a-z0-9]{1,8}$/i)||[''])[0];
 let name=String(input||'').trim().replace(/[\\/\x00-\x1f<>:"|?*]/g,'').replace(/\s+/g,'_');
 if(!name)return '';
 if(extension && name.toLowerCase().endsWith(extension.toLowerCase()))name=name.slice(0,-extension.length);
 name=name.replace(/\.+$/,'').slice(0,100);
 if(!name)return '';
 return name+extension;
}
async function renameResource(path){
 if(!isParent())return resourceMessage('Accès Parent nécessaire.');
 const displayName=readableFilename(path);
 const wanted=window.prompt('Nouveau nom du document (extension conservée) :',displayName);
 if(wanted===null)return;
 const next=cleanNewFilename(wanted,path);
 if(!next)return resourceMessage('Nom de fichier invalide.');
 const folder=path.slice(0,path.lastIndexOf('/')+1);
 const old=path.split('/').pop();
 const filename=old.replace(/^(\d{13}-[a-z0-9]{6}-)/i,'');
 const prefix=old.slice(0,old.length-filename.length);
 const target=folder+prefix+next;
 if(target===path)return resourceMessage('Aucun changement de nom.');
 if(!window.confirm('Renommer « '+displayName+' » en « '+next+' » ?'))return;
 resourceMessage('Renommage en cours…');
 const {error}=await client.storage.from(resourcesBucket).move(path,target);
 if(error)return resourceMessage('Renommage impossible : '+error.message+'. Vérifie la règle UPDATE sur Supabase.');
 resourceMessage('Document renommé.');await showParentResources(false);
}
async function deleteResource(path){
 if(!isParent())return resourceMessage('Accès Parent nécessaire.');
 const name=readableFilename(path);
 if(!window.confirm('Supprimer définitivement « '+name+' » ? Cette action est irréversible.'))return;
 resourceMessage('Suppression en cours…');
 const {data,error}=await client.storage.from(resourcesBucket).remove([path]);
 if(error)return resourceMessage('Suppression impossible : '+error.message+'. Vérifie la règle DELETE sur Supabase.');
 if(!data||!data.length)return resourceMessage('La suppression n’a pas été confirmée par le stockage.');
 resourceMessage('Document supprimé définitivement.');await showParentResources(false);
}

   .select('sender_id,created_at').eq('conversation_id',m.conversation_id)
   .order('created_at',{ascending:false}).limit(1000)));

  });

async function inboxItems(uid){

 while(offset<2000){
  const {data,error}=await client.storage.from(bucket).list(inboxPrefix(uid),{limit:100,offset,sortBy:{column:'name',order:'desc'}});
  if(error)throw error;
  const batch=(data||[]).filter(item=>item.id);
  items.push(...batch.map(item=>({...item,path:inboxPrefix(uid)+'/'+item.name})));
  if((data||[]).length<100)break;
  offset+=(data||[]).length;
 }
 return items;
}

 panel.innerHTML='<h2>📥 Documents reçus <span id="inboxCount" class="tag">…</span></h2><p class="hint">Envois d’Alexane et Clémence. Télécharge un document, puis classe-le dans « Ajouter des documents pédagogiques ». La suppression reste manuelle.</p><div class="actions"><button id="inboxParentReload" class="secondary">🔄 Actualiser la réception</button></div><div id="inboxParentStatus" class="status" role="status">Chargement des envois…</div><div id="inboxParentList"></div>';
 const slot=document.getElementById('inboxSlot');if(slot)slot.appendChild(panel);else app.insertBefore(panel,app.firstChild);
 document.getElementById('inboxParentReload').onclick=loadInboxParent;
 loadInboxParent();
}
async function loadInboxParent(){
 const dest=document.getElementById('inboxParentList');if(!dest)return;dest.replaceChildren();let count=0,fail=[];
 for(const who of ['Alexane','Clémence']){
  const uid=parentUIDs[who];if(!uid){fail.push('UID '+who+' manquant');continue}
  try{const files=await inboxItems(uid);count+=files.length;
   for(const f of files){const row=document.createElement('div');row.className='resource-entry';const label=document.createElement('span');label.textContent=(inboxIsLink(f.path)?'🔗 ':'📎 ')+inboxName(f.path)+' — '+who+' — '+new Date(f.created_at||Date.now()).toLocaleDateString('fr-FR');const buttons=document.createElement('div');buttons.className='resource-buttons';const open=document.createElement('button');open.className='secondary';open.textContent='Ouvrir / télécharger';open.onclick=()=>inboxOpen(f.path).catch(e=>inboxMsg('inboxParentStatus',e.message));const del=document.createElement('button');del.className='danger';del.textContent='Supprimer';del.onclick=()=>inboxRemove(f.path,'inboxParentStatus',loadInboxParent);buttons.append(open,del);row.append(label,buttons);dest.append(row)}
  }catch(e){fail.push(who+' : '+e.message)}
 }
 const total=document.getElementById('inboxCount');if(total)total.textContent=count+' reçu(s)';
 inboxMsg('inboxParentStatus',fail.length?'Chargement incomplet : '+fail.join(' ; ') : count+' document(s) dans la boîte de réception.');
 if(!count&&!fail.length)dest.textContent='Boîte vide.';
}
// Ajouter les panneaux uniquement aux vues principales, sans toucher aux autres fonctions.
const originalSubjectsViewInbox=subjectsView;
subjectsView=function(d){originalSubjectsViewInbox(d);studentInboxPanel()};
const originalParentViewInbox=parentView;
// Espace Parent : accueil épuré et gestion séparée, sans modifier les outils existants.
let parentActiveTab='home';
function parentTabsApply(){
 const home=document.getElementById('parentTabHomeContent');
 const resources=document.getElementById('parentTabResourcesContent');
 const homeButton=document.getElementById('parentTabHome');
 const resourcesButton=document.getElementById('parentTabResources');
 if(!home||!resources)return;
 const onHome=parentActiveTab==='home';
 home.classList.toggle('hidden',!onHome);
 resources.classList.toggle('hidden',onHome);
 homeButton.classList.toggle('active',onHome);
 resourcesButton.classList.toggle('active',!onHome);
 homeButton.setAttribute('aria-selected',String(onHome));
 resourcesButton.setAttribute('aria-selected',String(!onHome));
}
parentView=function(){
 originalParentViewInbox();
 parentInboxPanel();
 const inbox=document.getElementById('inboxParentList')?.closest('.panel');
 const otherNodes=Array.from(app.childNodes).filter(n=>n!==inbox);
 const tabs=document.createElement('nav');
 tabs.className='parent-nav-tabs';
 tabs.setAttribute('aria-label','Navigation espace Parent');
 tabs.innerHTML='<button type="button" id="parentTabHome" class="parent-nav-tab" aria-selected="true">🏠 Mon accueil</button><button type="button" id="parentTabResources" class="parent-nav-tab" aria-selected="false">📁 Gestion des ressources</button>';
 const home=document.createElement('div');home.id='parentTabHomeContent';
 const resources=document.createElement('div');resources.id='parentTabResourcesContent';
 for(const node of otherNodes)resources.appendChild(node);
 if(inbox)home.appendChild(inbox);
 else home.innerHTML='<div class="panel"><h2>📥 Documents reçus</h2><p class="muted">La boîte de réception sera disponible après connexion au compte Parent.</p></div>';
 app.replaceChildren(tabs,home,resources);
 document.getElementById('parentTabHome').onclick=()=>{parentActiveTab='home';parentTabsApply()};
 document.getElementById('parentTabResources').onclick=()=>{parentActiveTab='resources';parentTabsApply()};
 parentTabsApply();
};

async function logout(){if(client)await client.auth.signOut();session=null;unreadUser='';displayUnread(0);user='Alexane';showWelcome=true;subject=null;lesson=null;cloudChapter=null;render()}
